<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerPath | Campus Placement Training &amp; Competitive Exam Mastery</title>
  <meta name="description"
    content="CareerPath is the end-to-end career readiness platform for college students and fresh graduates. Master campus placement rounds (TCS, Infosys, Cognizant, Wipro, Accenture) and competitive exams (GATE, CAT, Banking) with authentic PYQs, live coding compiler, resume ATS optimizer, and AI mock interviews.">

  <!-- PDF.js CDN for In-Browser Resume Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX for High-Performance LaTeX Math Rendering in Competitive Exams -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    code,
    pre,
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .proctored-canvas {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    @keyframes pulseRed {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(1.15);
      }
    }

    .animate-pulse-red {
      animation: pulseRed 1.2s infinite ease-in-out;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center p-8 bg-white rounded-3xl shadow-sm border border-slate-200">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4">
        </div>
        <p class="text-sm font-bold text-slate-700">Initializing CareerPath Career Readiness Platform...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const SECURITY_QUESTIONS_LIST = [
      "What is your primary school name?",
      "What city were you born in?",
      "What is your mother's middle name?",
      "What was the name of your first pet?",
      "What is your favorite book or movie?"
    ];

    // =========================================================================
    // 0. BRAND IDENTITY & LOGO COMPONENT
    // =========================================================================
    function CareerPathLogo({ size = 'md', isDark = false, showTagline = false, className = '' }) {
      const iconSizes = {
        sm: 'w-7 h-7',
        md: 'w-9 h-9',
        lg: 'w-11 h-11'
      };
      const textSizes = {
        sm: 'text-base',
        md: 'text-xl',
        lg: 'text-2xl'
      };

      return (
        <div className={`flex items-center gap-2.5 select-none ${className}`}>
          {/* Geometric Upward Trajectory & Direction Emblem */}
          <div className={`${iconSizes[size] || iconSizes.md} relative flex items-center justify-center flex-shrink-0`}>
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full drop-shadow-xs">
              <defs>
                <linearGradient id="cpGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#0f172a" />
                  <stop offset="100%" stopColor="#312e81" />
                </linearGradient>
                <linearGradient id="cpGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#4f46e5" />
                  <stop offset="100%" stopColor="#6366f1" />
                </linearGradient>
                <linearGradient id="cpGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stopColor="#38bdf8" />
                  <stop offset="100%" stopColor="#4f46e5" />
                </linearGradient>
              </defs>
              {/* Foundation Milestone */}
              <path d="M6 34L18 22L24 28L12 40H6V34Z" fill="url(#cpGrad1)" />
              {/* Ascending Pathway Bar */}
              <path d="M16 40L28 28L34 34L22 46H16V40Z" fill="url(#cpGrad2)" />
              {/* Upward Apex Trajectory Chevron */}
              <path d="M22 20L36 6L42 12L28 26L22 20Z" fill="url(#cpGrad2)" />
              <path d="M34 6H42V14L34 6Z" fill="url(#cpGrad3)" />
              {/* North Star / Directional Beacon */}
              <circle cx="39" cy="9" r="2.5" fill="#ffffff" />
            </svg>
          </div>

          {/* Typography */}
          <div className="flex flex-col">
            <div className={`font-black tracking-tight leading-none ${textSizes[size] || textSizes.md}`}>
              <span className={isDark ? 'text-white' : 'text-slate-900'}>Career</span>
              <span className="bg-gradient-to-r from-indigo-600 via-indigo-500 to-violet-600 bg-clip-text text-transparent">Path</span>
            </div>
            {showTagline && (
              <span className={`text-[9px] font-extrabold uppercase tracking-widest mt-1 ${isDark ? 'text-indigo-300/90' : 'text-slate-400'}`}>
                Campus to Career
              </span>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 1. STRICT AUTHENTICATION GATE (SIGN IN, REGISTER, FORGOT PASSWORD)
    // =========================================================================
    function AuthGate({ onAuthSuccess, onClose, initialMode = 'login' }) {
      const [authMode, setAuthMode] = useState(initialMode); // 'login' | 'register' | 'forgot'
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [successMsg, setSuccessMsg] = useState('');

      useEffect(() => {
        setAuthMode(initialMode);
      }, [initialMode]);

      // Form States (Strictly EMPTY - no pre-filled or demo credentials)
      const [formData, setFormData] = useState({
        fullName: '',
        emailOrMobile: '',
        password: '',
        confirmPassword: '',
        securityQuestion1: SECURITY_QUESTIONS_LIST[0],
        securityAnswer1: '',
        securityQuestion2: SECURITY_QUESTIONS_LIST[1],
        securityAnswer2: ''
      });

      // Forgot Password State Wizard
      const [forgotStep, setForgotStep] = useState(1);
      const [forgotIdentifier, setForgotIdentifier] = useState('');
      const [challengeQuestions, setChallengeQuestions] = useState([]);
      const [challengeAnswers, setChallengeAnswers] = useState({ answer1: '', answer2: '' });
      const [resetToken, setResetToken] = useState('');
      const [newPasswordData, setNewPasswordData] = useState({ newPassword: '', confirmPassword: '' });

      const handleRegister = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');

        if (formData.password !== formData.confirmPassword) {
          setErrorMsg('Passwords do not match.');
          return;
        }

        if (formData.password.length < 6) {
          setErrorMsg('Password must be at least 6 characters long.');
          return;
        }

        setLoading(true);
        try {
          const payload = {
            ...formData,
            email: formData.emailOrMobile,
            emailOrMobile: formData.emailOrMobile,
            securityQ1: formData.securityQuestion1,
            securityQuestion1: formData.securityQuestion1,
            securityA1: formData.securityAnswer1 || 'school',
            securityAnswer1: formData.securityAnswer1 || 'school',
            securityQ2: formData.securityQuestion2,
            securityQuestion2: formData.securityQuestion2,
            securityA2: formData.securityAnswer2 || 'city',
            securityAnswer2: formData.securityAnswer2 || 'city'
          };
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Registration failed');

          localStorage.setItem('portal_auth_token', data.token);
          localStorage.setItem('portal_user_profile', JSON.stringify(data.user));
          onAuthSuccess(data.user);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setSuccessMsg('');
        setLoading(true);

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: formData.emailOrMobile,
              emailOrMobile: formData.emailOrMobile,
              identifier: formData.emailOrMobile,
              password: formData.password
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Login failed');

          localStorage.setItem('portal_auth_token', data.token);
          localStorage.setItem('portal_user_profile', JSON.stringify(data.user));
          onAuthSuccess(data.user);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleForgotStep1 = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          const res = await fetch('/api/auth/forgot-password/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ emailOrMobile: forgotIdentifier })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Account not found');

          setChallengeQuestions(data.questions);
          setForgotStep(2);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleForgotStep2 = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          const res = await fetch('/api/auth/forgot-password/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              emailOrMobile: forgotIdentifier,
              answer1: challengeAnswers.answer1,
              answer2: challengeAnswers.answer2
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Verification failed');

          setResetToken(data.resetToken);
          setForgotStep(3);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleForgotStep3 = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        if (newPasswordData.newPassword !== newPasswordData.confirmPassword) {
          setErrorMsg('New passwords do not match.');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/api/auth/forgot-password/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              resetToken,
              newPassword: newPasswordData.newPassword,
              confirmPassword: newPasswordData.confirmPassword
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Reset failed');

          setSuccessMsg('Password reset successful! Please sign in with your new password.');
          setAuthMode('login');
          setForgotStep(1);
          setForgotIdentifier('');
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className={`${onClose ? 'fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm' : 'min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900'} flex items-center justify-center p-4 overflow-y-auto`}>
          <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-800/10 overflow-hidden animate-fade-in font-sans relative my-auto">
            {/* Top Branding Banner */}
            <div className="bg-slate-900 text-white p-7 text-center relative">
              {onClose && (
                <button
                  onClick={onClose}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white p-1.5 rounded-xl hover:bg-slate-800 transition cursor-pointer"
                  title="Close modal"
                >
                  ✕
                </button>
              )}
              <div className="flex justify-center mb-3">
                <CareerPathLogo size="lg" isDark={true} showTagline={true} />
              </div>
              <h1 className="text-lg font-black tracking-tight text-white mt-1">Student Portal Authentication</h1>
              <p className="text-xs text-indigo-300 font-medium mt-0.5">Campus Placement Training &amp; Competitive Exam Engine</p>
              <span className="inline-block mt-2 text-[10px] uppercase tracking-wider font-extrabold bg-indigo-500/20 text-indigo-300 px-3 py-0.5 rounded-full border border-indigo-400/30">
                🔒 Secure Student Access
              </span>
            </div>

            {/* Mode Switcher Tabs */}
            {authMode !== 'forgot' && (
              <div className="flex border-b border-slate-100 bg-slate-50/80">
                <button
                  onClick={() => { setAuthMode('login'); setErrorMsg(''); setSuccessMsg(''); }}
                  className={`flex-1 py-3.5 text-xs font-black transition border-b-2 ${authMode === 'login'
                    ? 'border-indigo-600 text-indigo-700 bg-white'
                    : 'border-transparent text-slate-500 hover:text-slate-900'
                    }`}
                >
                  Candidate Sign In
                </button>
                <button
                  onClick={() => { setAuthMode('register'); setErrorMsg(''); setSuccessMsg(''); }}
                  className={`flex-1 py-3.5 text-xs font-black transition border-b-2 ${authMode === 'register'
                    ? 'border-indigo-600 text-indigo-700 bg-white'
                    : 'border-transparent text-slate-500 hover:text-slate-900'
                    }`}
                >
                  New Registration
                </button>
              </div>
            )}

            <div className="p-7">
              {errorMsg && (
                <div className="mb-4 p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-bold flex items-center gap-2">
                  <span>⚠️</span>
                  <span>{errorMsg}</span>
                </div>
              )}

              {successMsg && (
                <div className="mb-4 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl font-bold flex items-center gap-2">
                  <span>✅</span>
                  <span>{successMsg}</span>
                </div>
              )}

              {/* 1. LOGIN FORM */}
              {authMode === 'login' && (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">
                      Email Address or Mobile Number
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. name@gmail.com or 9876543210"
                      value={formData.emailOrMobile}
                      onChange={(e) => setFormData({ ...formData, emailOrMobile: e.target.value })}
                      required
                      className="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="text-xs font-extrabold text-slate-700 uppercase tracking-wider">
                        Password
                      </label>
                      <button
                        type="button"
                        onClick={() => { setAuthMode('forgot'); setErrorMsg(''); setSuccessMsg(''); }}
                        className="text-xs font-bold text-indigo-600 hover:underline"
                      >
                        Forgot Password?
                      </button>
                    </div>
                    <input
                      type="password"
                      placeholder="••••••••"
                      value={formData.password}
                      onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                      required
                      className="w-full px-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full mt-2 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-md transition transform active:scale-98 flex items-center justify-center gap-2"
                  >
                    {loading ? (
                      <span className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                    ) : (
                      <span>🚀 Sign In to Practice Portal</span>
                    )}
                  </button>

                  <div className="relative my-3">
                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div>
                    <div className="relative flex justify-center text-[10px] uppercase"><span className="bg-white px-2 text-slate-400 font-extrabold">Instant Access</span></div>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      const guestUser = { id: 'guest-' + Date.now(), fullName: 'Candidate (Guest)', emailOrMobile: 'candidate@placement.edu' };
                      localStorage.setItem('portal_user_profile', JSON.stringify(guestUser));
                      onAuthSuccess(guestUser);
                    }}
                    className="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center justify-center gap-2"
                  >
                    ⚡ Continue as Guest Candidate
                  </button>
                </form>
              )}

              {/* 2. REGISTRATION FORM */}
              {authMode === 'register' && (
                <form onSubmit={handleRegister} className="space-y-3.5 max-h-[75vh] overflow-y-auto pr-1.5">
                  <div>
                    <label className="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">
                      Candidate Full Name
                    </label>
                    <input
                      type="text"
                      placeholder="Your official name"
                      value={formData.fullName}
                      onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                      required
                      className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">
                      Email (Gmail) or 10-Digit Mobile
                    </label>
                    <input
                      type="text"
                      placeholder="student@gmail.com or 9876543210"
                      value={formData.emailOrMobile}
                      onChange={(e) => setFormData({ ...formData, emailOrMobile: e.target.value })}
                      required
                      className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">
                        Password
                      </label>
                      <input
                        type="password"
                        placeholder="Min 6 chars"
                        value={formData.password}
                        onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                        required
                        className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1">
                        Confirm
                      </label>
                      <input
                        type="password"
                        placeholder="Re-enter"
                        value={formData.confirmPassword}
                        onChange={(e) => setFormData({ ...formData, confirmPassword: e.target.value })}
                        required
                        className="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                      />
                    </div>
                  </div>

                  {/* Security Questions Setup (Optional with defaults) */}
                  <div className="pt-2 border-t border-slate-100">
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="block text-xs font-black text-indigo-900">
                        🛡️ Recovery Security Questions
                      </span>
                      <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded">
                        Optional
                      </span>
                    </div>

                    <div className="space-y-2.5 text-xs">
                      <div>
                        <div className="relative">
                          <select
                            value={formData.securityQuestion1}
                            onChange={(e) => setFormData({ ...formData, securityQuestion1: e.target.value })}
                            className="w-full px-3 py-2 pr-7 bg-slate-100 border border-slate-200 rounded-xl font-medium focus:outline-none cursor-pointer appearance-none text-slate-800"
                          >
                            {SECURITY_QUESTIONS_LIST.map((q, idx) => (
                              <option key={idx} value={q}>{q}</option>
                            ))}
                          </select>
                          <span className="absolute right-2.5 top-2.5 pointer-events-none text-slate-500 text-[10px]">▼</span>
                        </div>
                        <input
                          type="text"
                          placeholder="Your answer (optional - default: school)"
                          value={formData.securityAnswer1}
                          onChange={(e) => setFormData({ ...formData, securityAnswer1: e.target.value })}
                          className="w-full mt-1.5 px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>

                      <div>
                        <div className="relative">
                          <select
                            value={formData.securityQuestion2}
                            onChange={(e) => setFormData({ ...formData, securityQuestion2: e.target.value })}
                            className="w-full px-3 py-2 pr-7 bg-slate-100 border border-slate-200 rounded-xl font-medium focus:outline-none cursor-pointer appearance-none text-slate-800"
                          >
                            {SECURITY_QUESTIONS_LIST.slice(1).map((q, idx) => (
                              <option key={idx} value={q}>{q}</option>
                            ))}
                          </select>
                          <span className="absolute right-2.5 top-2.5 pointer-events-none text-slate-500 text-[10px]">▼</span>
                        </div>
                        <input
                          type="text"
                          placeholder="Your answer (optional - default: city)"
                          value={formData.securityAnswer2}
                          onChange={(e) => setFormData({ ...formData, securityAnswer2: e.target.value })}
                          className="w-full mt-1.5 px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}

    // =========================================================================
    function CareerPathNavbar({
      currentView,
      setCurrentView,
      dashboardTab,
      setDashboardTab,
      setSelectedTopicSlug,
      currentUser,
      onSignOut,
      onStartDailyQuiz,
      onOpenPlacementPapers,
      onOpenTimedArena,
      onOpenExamCategory,
      onOpenExamSubView,
      onOpenUserProfile,
      onOpenSettings
    }) {
      const [activeDropdown, setActiveDropdown] = useState(null); // 'dashboard' | 'practice' | 'career' | 'interview' | 'exam_hub' | 'more' | 'user' | null
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [mobileExpandedSection, setMobileExpandedSection] = useState('dashboard');
      const navRef = useRef(null);

      // Close dropdown when clicking outside or pressing Escape
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (navRef.current && !navRef.current.contains(e.target)) {
            setActiveDropdown(null);
          }
        };
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setActiveDropdown(null);
            setMobileMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('mousedown', handleClickOutside);

        'Verbal Ability': []
      });
      const [activeSectionFilter, setActiveSectionFilter] = useState('all'); // 'all' | 'Arithmetic Aptitude' | 'Data Interpretation' | 'Verbal Ability'
      const [searchQuery, setSearchQuery] = useState('');
      const [stats, setStats] = useState({ totalTopics: 36, completedQuestions: 0, bookmarkedCount: 0 });

      // Placement Portal & Proctored Timed Arena State
      const [showPlacementModal, setShowPlacementModal] = useState(false);
      const [showDirectArenaModal, setShowDirectArenaModal] = useState(false);
      const [showAppPreFlightModal, setShowAppPreFlightModal] = useState(false);
      const [pendingArenaConfig, setPendingArenaConfig] = useState(null);
      const [activeArenaStream, setActiveArenaStream] = useState(null);
      const [placementResultData, setPlacementResultData] = useState(null);

      // Company Placement Mock Test Arena States
      const [companyMockSession, setCompanyMockSession] = useState(null);
      const [companyMockResult, setCompanyMockResult] = useState(null);
      const [companyMockLoading, setCompanyMockLoading] = useState(false);

      // Launch Daily Challenge into Timed Test Arena
      const handleStartDailyQuiz = async () => {
        try {
          const res = await fetch('/api/placement/daily');
          const data = await res.json();
          if (!data.questions || data.questions.length === 0) {
            alert('No daily questions available at this time.');
            return;
          }
          setPendingArenaConfig({
            title: "Today's Placement Challenge",
            subtitle: "10 Fresh Questions Across Aptitude, Reasoning & Coding",
            company: "Daily Placement Challenge",
            durationMinutes: 10,
            testType: 'daily_test',
            referenceId: 'daily-' + (data.date || Date.now()),
            category: 'DailyChallenge',
            questions: data.questions
          });
          setShowAppPreFlightModal(true);
        } catch (err) {
          alert('Could not start daily test: ' + err.message);
        }
      };

      // Launch Company Placement Paper into Timed Test Arena
      const handleSelectPlacementPaper = async (paper) => {
        try {
          setShowPlacementModal(false);
          const res = await fetch(`/api/placement/placement-papers/${paper.id}`);
          const data = await res.json();
          setPendingArenaConfig({
            title: paper.paper_title,
            subtitle: paper.instructions || `Official pattern mock paper for ${paper.company_name}`,
            company: paper.company_name,
            durationMinutes: paper.duration_minutes || 45,
            testType: 'placement_paper',
            referenceId: paper.id,
            category: paper.company_name,
            questions: data.questions || []
          });
          setShowAppPreFlightModal(true);
        } catch (err) {
          alert('Could not start placement paper: ' + err.message);
        }
      };

      // Launch Track Drill into Timed Test Arena
      const handleStartTrackPractice = async (track, subCategory) => {
        try {
          const params = new URLSearchParams();
          if (track.categoryKey) params.append('category', track.categoryKey);
          if (subCategory) params.append('subCategory', subCategory);
          params.append('limit', '10');

          const res = await fetch(`/api/placement/questions?${params.toString()}`);
          const data = await res.json();
          const qs = data.questions && data.questions.length > 0 ? data.questions : [];
          if (qs.length === 0) {
            alert(`No practice questions found for ${subCategory || track.title} yet.`);
            return;
          }
          setPendingArenaConfig({
            title: `${track.title} Arena`,
            subtitle: subCategory ? `Focused Drill: ${subCategory}` : 'Comprehensive Track Assessment',
            company: track.title,
            durationMinutes: 15,
            testType: 'category_quiz',
            referenceId: track.categoryKey,
            category: track.categoryKey || track.title,
            questions: qs
          });
          setShowAppPreFlightModal(true);
        } catch (err) {
          alert('Could not load track questions: ' + err.message);
        }
      };

      // Direct Arena Modal Launcher
      const handleLaunchDirectArenaOption = async (option) => {
        try {
          setShowDirectArenaModal(false);
          if (option.id === 'daily-challenge') {
            await handleStartDailyQuiz();
            return;
          }
          if (option.id.includes('paper')) {
            const paperIdMap = {
              'tcs-nqt-paper-1': 'paper-tcs-1',
              'infosys-paper-1': 'paper-inf-1',
              'cognizant-paper-1': 'paper-cts-1'
            };
            const paperId = paperIdMap[option.id] || 'paper-tcs-1';
            const res = await fetch(`/api/placement/placement-papers/${paperId}`);
            const data = await res.json();
            setPendingArenaConfig({
              title: option.title,
              subtitle: option.description,
              company: option.company,
              durationMinutes: option.durationMinutes,
              testType: 'placement_paper',
              referenceId: paperId,
              category: option.company,
              questions: data.questions || []
            });
            setShowAppPreFlightModal(true);
            return;
          }

          let catKey = 'Aptitude';
          if (option.id === 'reasoning-arena') catKey = 'Reasoning';
          if (option.id === 'coding-arena') catKey = 'Programming';
          const res = await fetch(`/api/placement/questions?category=${catKey}&limit=10`);
          const data = await res.json();
          setPendingArenaConfig({
            title: option.title,
            subtitle: option.description,
            company: option.company,
            durationMinutes: option.durationMinutes,
            testType: 'category_quiz',
            referenceId: catKey,
            category: catKey,
            questions: data.questions || []
          });
          setShowAppPreFlightModal(true);
        } catch (err) {
          alert('Could not initiate arena: ' + err.message);
        }
      };

      // Callback when pre-flight security check passes
      const handleAppPreFlightPassed = (stream) => {
        setActiveArenaStream(stream);
        setShowAppPreFlightModal(false);
        setCurrentView('timed_arena');
      };

      // Submit Proctored Timed Arena attempt to /api/assessment/submit
      const handleSubmitPlacementQuiz = async ({ answers, timeTakenSeconds, integrityReport }) => {
        try {
          const token = localStorage.getItem('portal_auth_token');
          const bodyPayload = {
            userId: currentUser ? currentUser.id : null,
            testId: pendingArenaConfig ? (pendingArenaConfig.referenceId || pendingArenaConfig.title) : 'Proctored Arena',
            topicSlug: pendingArenaConfig ? (pendingArenaConfig.category || pendingArenaConfig.referenceId) : 'general',
            userAnswers: answers,
            timeTakenSeconds,
            questionsList: pendingArenaConfig ? pendingArenaConfig.questions : [],
            integrityReport
          };

          const res = await fetch('/api/assessment/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            },
            body: JSON.stringify(bodyPayload)
          });

          const data = await res.json();
          setPlacementResultData({
            ...data,
            title: pendingArenaConfig?.title || 'Proctored Assessment',
            company: pendingArenaConfig?.company || 'Assessment Arena',
            timeTakenSeconds,
            integrityReport: data.integrityReport || integrityReport,
            integrityStatus: data.integrityStatus || (integrityReport.forcedAutoSubmit ? 'DISQUALIFIED_CHEATING' : 'COMPLETED_NORMALLY')
          });
          setCurrentView('placement_result');
        } catch (err) {
          alert('Error submitting test: ' + err.message);
        }
      };

      // Company Placement Mock Test Arena Handlers
      const handleStartCompanyMock = async (companyName) => {
        try {
          setCompanyMockLoading(true);
          const userId = currentUser ? currentUser.id : null;
          const res = await fetch(`/api/mock-test/generate?company=${encodeURIComponent(companyName)}&userId=${userId || ''}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error);

          setCompanyMockSession(data);
          setCurrentView('company_mock_test');
        } catch (err) {
          alert('Could not start company mock test: ' + err.message);
        } finally {
          setCompanyMockLoading(false);
        }
      };

      const handleSubmitCompanyMock = async ({ sessionId, companyName, userAnswers, timeTakenSeconds, strikes, forcedAutoSubmit }) => {
        try {
          const userId = currentUser ? currentUser.id : null;
          const token = localStorage.getItem('portal_auth_token');
          const res = await fetch('/api/mock-test/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            },
            body: JSON.stringify({
              sessionId,
              companyName,
              userAnswers,
              timeTakenSeconds,
              strikes,
              forcedAutoSubmit,
              userId
            })
          });
          const report = await res.json();
          if (report.error) throw new Error(report.error);

          setCompanyMockResult(report);
          setCurrentView('company_mock_result');
        } catch (err) {
          alert('Error submitting mock test: ' + err.message);
        }
      };

      const handleViewCompanySessionDetails = async (sessionId) => {
        try {
          const token = localStorage.getItem('portal_auth_token');
          const res = await fetch(`/api/mock-test/session/${sessionId}`, {
            headers: token ? { 'Authorization': `Bearer ${token}` } : {}
          });
          const session = await res.json();
          if (session.error) throw new Error(session.error);

          const pct = Math.round((session.score / (session.total_questions || 1)) * 100);
          setCompanyMockResult({
            sessionId: session.id,
            companyName: session.company_name,
            score: session.score,
            totalQuestions: session.total_questions,
            percentage: pct,
            overallCutoffPct: 65,
            qualificationStatus: session.qualification_status,
            verdictTitle: session.qualification_status === 'QUALIFIED_INTERVIEW'
              ? '🎉 Qualified for Interview Round!'
              : (session.qualification_status === 'DISQUALIFIED_CHEATING' ? 'Disqualified (Proctoring Violation)' : 'Needs Improvement to Clear Cut-off'),
            verdictMessage: session.qualification_status === 'QUALIFIED_INTERVIEW'
              ? `You scored ${pct}%, successfully clearing the required threshold.`
              : `Your score of ${pct}% needs improvement to reach the required cut-off.`,
            sectionalBreakdown: session.sectional_scores || [],
            weakTopics: [],
            review: [],
            timeTakenSeconds: 1800
          });
          setCurrentView('company_mock_result');
        } catch (err) {
          alert('Error loading test report: ' + err.message);
        }
      };

      // Session Verification
      useEffect(() => {
        const token = localStorage.getItem('portal_auth_token');
        if (!token) {
          setCheckingAuth(false);
          return;
        }

        fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
          .then(res => {
            if (!res.ok) throw new Error('Invalid token');
            return res.json();
          })
          .then(data => {
            if (data.user) {
              setCurrentUser(data.user);
              if (data.stats) {
                setStats(prev => ({
                  ...prev,
                  bookmarkedCount: data.stats.bookmarkedCount || 0
                }));
              }
            }
          })
          .catch(() => {
            localStorage.removeItem('portal_auth_token');
            localStorage.removeItem('portal_user_profile');
            setCurrentUser(null);
          })
          .finally(() => setCheckingAuth(false));
      }, []);

      // Load Topics
      const loadTopics = useCallback(() => {
        const token = localStorage.getItem('portal_auth_token');
        fetch('/api/topics', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        })
          .then(res => res.json())
          .then(data => {
            if (data.sections) {
              setSectionsData(data.sections);
              // Calculate total completed questions across topics
              let completed = 0;
              Object.values(data.sections).forEach(topicList => {
                topicList.forEach(t => {
                  completed += (t.completed_questions_count || 0);
                });
              });
              setStats(prev => ({
                ...prev,
                totalTopics: data.totalTopics || 36,
                completedQuestions: completed
              }));
            }
          })
          .catch(err => console.warn('Topics load warning:', err));
      }, []);

      useEffect(() => {
        if (currentUser) {
          loadTopics();
        }
      }, [currentUser, loadTopics]);

      const handleSignOut = () => {
        localStorage.removeItem('portal_auth_token');
        localStorage.removeItem('portal_user_profile');
        setCurrentUser(null);
        setCurrentView('landing');
      };

      if (checkingAuth) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-900 text-white">
            <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          </div>
        );
      }

      // If on public landing page OR unauthenticated without active auth modal
      if (currentView === 'landing' || (!currentUser && !showAuthModal)) {
        return (
          <div className="relative">
            <CareerPathLandingPage
              onOpenAuth={(mode) => {
                setAuthModalMode(mode || 'login');
                setShowAuthModal(true);
              }}
              onOpenTrack={(trackKey) => {
                if (currentUser) {
                  setCurrentView(trackKey || 'home');
                  setSelectedTopicSlug(null);
                } else {
                  setAuthModalMode('register');
                  setShowAuthModal(true);
                }
              }}
              onLaunchDiagnostic={() => {
                if (currentUser) {
                  setCurrentView('home');
                  handleStartDailyQuiz();
                } else {
                  setAuthModalMode('register');
                  setShowAuthModal(true);
                }
              }}
              currentUser={currentUser}
            />

            {showAuthModal && (
              <AuthGate
                initialMode={authModalMode}
                onClose={() => setShowAuthModal(false)}
                onAuthSuccess={(user) => {
                  setCurrentUser(user);
                  setShowAuthModal(false);
                  loadTopics();
                  setCurrentView('home');
                }}
              />
            )}
          </div>
        );
      }

      // If user is unauthenticated and prompted directly for auth
      if (!currentUser) {
        return (
          <AuthGate
            initialMode={authModalMode}
            onClose={() => {
              setShowAuthModal(false);
              setCurrentView('landing');
            }}
            onAuthSuccess={(user) => {
              setCurrentUser(user);
              setShowAuthModal(false);
              loadTopics();
              setCurrentView('home');
            }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
          {/* Top Navbar */}
          <CareerPathNavbar
            currentView={currentView}
            setCurrentView={setCurrentView}
            dashboardTab={dashboardTab}
            setDashboardTab={setDashboardTab}
            setSelectedTopicSlug={setSelectedTopicSlug}
            currentUser={currentUser}
            onSignOut={handleSignOut}
            onStartDailyQuiz={handleStartDailyQuiz}
            onOpenPlacementPapers={() => setShowPlacementModal(true)}
            onOpenTimedArena={() => setShowDirectArenaModal(true)}
            onOpenExamCategory={(categorySlug) => {
              setActiveExamCategory(categorySlug);
              setActiveExamSubView('hub');
              setCurrentView('competitive_exams');
              setSelectedTopicSlug(null);
            }}
            onOpenExamSubView={(subView) => {
              setActiveExamSubView(subView);
              setCurrentView('competitive_exams');
              setSelectedTopicSlug(null);
            }}
            onOpenUserProfile={() => setShowUserProfileModal(true)}
            onOpenSettings={() => setShowSettingsModal(true)}
          />

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {/* VIEW 1: HOME PAGE (TOPICS GRID) */}
            {currentView === 'home' && (
              <CareerPathDashboard
                currentUser={currentUser}
                stats={stats}
                dashboardTab={dashboardTab}
                setDashboardTab={setDashboardTab}
                onStartDailyQuiz={handleStartDailyQuiz}
                onOpenPlacementPapers={() => setShowPlacementModal(true)}
                onOpenCompanyArena={() => { setCurrentView('company_mock_arena'); setSelectedTopicSlug(null); }}
                onOpenResumeMatcher={() => { setCurrentView('resume_matcher'); setSelectedTopicSlug(null); }}
                onOpenMockInterview={() => { setCurrentView('mock_interview'); setSelectedTopicSlug(null); }}
                onOpenExamHub={() => { setCurrentView('competitive_exams'); setSelectedTopicSlug(null); }}
                onOpenCompiler={() => { setCurrentView('live_coding'); setSelectedTopicSlug(null); }}
                onOpenLeaderboard={() => { setCurrentView('campus_leaderboard'); setSelectedTopicSlug(null); }}
                onOpenJobsPortal={() => { setCurrentView('jobs_portal'); setSelectedTopicSlug(null); }}
                onOpenInterviewCenter={() => { setCurrentView('interview_center'); setSelectedTopicSlug(null); }}
                onSelectTopicFolder={(slug) => { setSelectedTopicSlug(slug); setCurrentView('topic_folder'); }}
                sectionsData={sectionsData}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                activeSectionFilter={activeSectionFilter}
                setActiveSectionFilter={setActiveSectionFilter}
                TRACKS={TRACKS}
                handleStartTrackPractice={handleStartTrackPractice}
              />
            )}

            {/* VIEW 2: TOPIC FOLDER (PRACTICE & ASSESSMENT ARENA) */}
            {currentView === 'topic_folder' && selectedTopicSlug && (
              <TopicArena
                slug={selectedTopicSlug}
                onBack={() => {
                  setCurrentView('home');
                  loadTopics();
                }}
                onBookmarkUpdated={() => {
                  loadTopics();
                }}
              />
            )}

            {/* VIEW 3: BOOKMARKS VAULT */}
            {currentView === 'bookmarks' && (
              <BookmarksVault
                onBack={() => {
                  setCurrentView('home');
                  loadTopics();
                }}
                onOpenTopic={(slug) => {
                  setSelectedTopicSlug(slug);
                  setCurrentView('topic_folder');
                }}
              />
            )}

            {/* VIEW 4: SECURE PROCTORED TIMED TEST ARENA */}
            {currentView === 'timed_arena' && pendingArenaConfig && (
              <TimedTestArena
                questions={pendingArenaConfig.questions}
                durationMinutes={pendingArenaConfig.durationMinutes}
                topicName={pendingArenaConfig.title}
                company={pendingArenaConfig.company}
                testId={pendingArenaConfig.referenceId || pendingArenaConfig.title}
                mediaStream={activeArenaStream}
                onSubmit={handleSubmitPlacementQuiz}
                onCancel={() => {
                  if (confirm('Cancel assessment and return to portal home? All unsubmitted answers will be discarded.')) {
                    if (activeArenaStream) activeArenaStream.getTracks().forEach(t => t.stop());
                    if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
                    setCurrentView('home');
                  }
                }}
              />
            )}

            {/* VIEW 5: PLACEMENT RESULT & PROCTORING AUDIT REPORT */}
            {currentView === 'placement_result' && placementResultData && (
              <PlacementResultScreen
                result={placementResultData}
                onBack={() => {
                  setPendingArenaConfig(null);
                  setPlacementResultData(null);
                  setCurrentView('home');
                }}
                onRetake={() => {
                  setPlacementResultData(null);
                  setShowAppPreFlightModal(true);
                }}
              />
            )}

            {/* VIEW 6: COMPANY PLACEMENT MOCK TEST ARENA DASHBOARD */}
            {currentView === 'company_mock_arena' && (
              <CompanyMockDashboard
                currentUser={currentUser}
                onStartMock={handleStartCompanyMock}
                onViewSessionDetails={handleViewCompanySessionDetails}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* VIEW 7: ADAPTIVE PROCTORED COMPANY MOCK TEST */}
            {currentView === 'company_mock_test' && companyMockSession && (
              <CompanyMockArena
                session={companyMockSession}
                currentUser={currentUser}
                onSubmit={handleSubmitCompanyMock}
                onCancel={() => {
                  if (confirm('Cancel company mock test and return to Mock Arena? Your answers will not be scored.')) {
                    if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
                    setCurrentView('company_mock_arena');
                  }
                }}
              />
            )}

            {/* VIEW 8: POST-TEST COMPANY CUT-OFF DIAGNOSTICS & SOLUTIONS */}
            {currentView === 'company_mock_result' && companyMockResult && (
              <CompanyMockResult
                result={companyMockResult}
                onRetake={(companyName) => handleStartCompanyMock(companyName)}
                onBackToDashboard={() => {
                  setCompanyMockResult(null);
                  setCurrentView('company_mock_arena');
                }}
              />
            )}

            {/* VIEW 9: LIVE IN-BROWSER CODE COMPILER & SANDBOX */}
            {(currentView === 'live_coding' || currentView === 'coding_sandbox') && (
              <LiveCodingSandbox
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* VIEW 10: AI RESUME VS JOB DESCRIPTION MATCHER */}
            {currentView === 'resume_matcher' && (
              <ResumeJobMatcher
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* VIEW 11: REAL-TIME AI PLACEMENT INTERVIEW ASSISTANT */}
            {currentView === 'mock_interview' && (
              <MockInterviewSimulator
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* VIEW 12: FORMULA DRAWERS & ACTIVE-RECALL FLASHCARDS */}
            {currentView === 'formula_sheets' && (
              <FormulaCheatSheets
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* VIEW 13: CAMPUS LEADERBOARD & RECRUITMENT RANKINGS */}
            {currentView === 'campus_leaderboard' && (
              <CampusLeaderboard
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* VIEW 20: COMPETITIVE EXAM PREP & REAL-TIME ARENA */}
            {currentView === 'competitive_exams' && (
              <CompetitiveExamsManager
                onBack={() => setCurrentView('home')}
                initialSubView={activeExamSubView}
                initialCategory={activeExamCategory}
              />
            )}

            {/* VIEW 14: JOBS & CAMPUS PLACEMENT DRIVES */}
            {currentView === 'jobs_portal' && (
              <JobsDrivePortal
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
                onOpenApplications={() => setCurrentView('student_applications')}
                onLaunchInterviewCenter={() => setCurrentView('interview_center')}
              />
            )}

            {/* VIEW 15: STUDENT MY APPLICATIONS & VISUAL TIMELINE */}
            {currentView === 'student_applications' && (
              <StudentApplicationsPortal
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
                onOpenInterviewCenter={() => setCurrentView('interview_center')}
                onLaunchAiPrep={(app) => {
                  setSelectedPrepContext(app);
                  setCurrentView('ai_prep_suite');
                }}
              />
            )}

            {/* VIEW 16: STUDENT INTERVIEW CENTER & ACTIONABLE RSVP */}
            {currentView === 'interview_center' && (
              <StudentInterviewCenter
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
                onLaunchAiPrep={(inv) => {
                  setSelectedPrepContext(inv);
                  setCurrentView('ai_prep_suite');
                }}
              />
            )}

            {/* VIEW 17: AI INTERVIEW PREPARATION SUITE */}
            {currentView === 'ai_prep_suite' && (
              <AiInterviewPrepSuite
                contextData={selectedPrepContext}
                onBack={() => setCurrentView('interview_center')}
              />
            )}

            {/* VIEW 18: RECRUITER CANDIDATE MANAGEMENT CONSOLE */}
            {currentView === 'recruiter_console' && (
              <RecruiterConsole
                currentUser={currentUser}
                onBack={() => setCurrentView('home')}
              />
            )}

            {/* User Profile & Assessment History Modal */}
            <UserProfileModal
              isOpen={showUserProfileModal}
              onClose={() => setShowUserProfileModal(false)}
              user={currentUser}
              onSignOut={handleSignOut}
            />

            {/* Platform Settings Modal */}
            <UserSettingsModal
              isOpen={showSettingsModal}
              onClose={() => setShowSettingsModal(false)}
            />

            {/* Placement Papers Modal */}
            <PlacementPapersModal
              isOpen={showPlacementModal}
              onClose={() => setShowPlacementModal(false)}
              onSelectPaper={handleSelectPlacementPaper}
            />

            {/* Direct Timed Test Arena Launcher Modal */}
            <DirectArenaModal
              isOpen={showDirectArenaModal}
              onClose={() => setShowDirectArenaModal(false)}
              onLaunchTest={handleLaunchDirectArenaOption}
            />

            {/* Automated Pre-Flight Security Checklist Modal */}
            {showAppPreFlightModal && pendingArenaConfig && (
              <PreFlightModal
                topicName={pendingArenaConfig.title}
                company={pendingArenaConfig.company}
                durationMinutes={pendingArenaConfig.durationMinutes}
                questionCount={pendingArenaConfig.questions?.length || 10}
                onCancel={() => setShowAppPreFlightModal(false)}
                onProceed={handleAppPreFlightPassed}
              />
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // 3. PROCTORING HELPERS & PRE-FLIGHT HARDWARE VERIFICATION GATE
    // =========================================================================
    function createVirtualProctorStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 240;
      const ctx = canvas.getContext('2d');
      let y = 0;
      let dir = 1.5;

      function renderFrame() {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Tech grid
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let py = 0; py < canvas.height; py += 20) {
          ctx.beginPath();
          ctx.moveTo(0, py);
          ctx.lineTo(canvas.width, py);
          ctx.stroke();
        }

        // Candidate Silhouette
        ctx.strokeStyle = '#6366f1';
        ctx.fillStyle = '#1e1b4b';
        ctx.lineWidth = 2;
        // Head
        ctx.beginPath();
        ctx.arc(160, 95, 42, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Shoulders
        ctx.beginPath();
        ctx.arc(160, 225, 75, Math.PI, 0);
        ctx.fill();
        ctx.stroke();

        // Biometric Face Tracking Box
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(110, 50, 100, 95);
        // Corners
        ctx.fillStyle = '#10b981';
        ctx.fillRect(108, 48, 8, 3);
        ctx.fillRect(108, 48, 3, 8);
        ctx.fillRect(204, 48, 8, 3);
        ctx.fillRect(209, 48, 3, 8);
        ctx.fillRect(108, 142, 8, 3);
        ctx.fillRect(108, 137, 3, 8);
        ctx.fillRect(204, 142, 8, 3);
        ctx.fillRect(209, 137, 3, 8);

        // Horizontal laser scanning line
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();

        y += dir;
        if (y > canvas.height || y < 0) dir *= -1;

        // Overlay text
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 11px JetBrains Mono, monospace';
        ctx.fillText('LIVE AI PROCTOR • STREAM ACTIVE', 12, 22);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px JetBrains Mono, monospace';
        ctx.fillText('FACE DETECTED • 30 FPS • 720p', 12, 36);

        requestAnimationFrame(renderFrame);
      }
      renderFrame();
      return canvas.captureStream(30);
    }

    // Automated Pre-Flight Security Checklist Modal
    function PreFlightModal({ topicName, durationMinutes, questionCount, onCancel, onProceed }) {
      const [cameraStatus, setCameraStatus] = useState('checking'); // 'checking' | 'granted' | 'denied'
      const [errorMessage, setErrorMessage] = useState('');
      const [stream, setStream] = useState(null);
      const [acknowledgedRules, setAcknowledgedRules] = useState(false);
      const [simulatedMode, setSimulatedMode] = useState(false);
      const previewVideoRef = useRef(null);

      const requestRealCamera = async () => {
        setCameraStatus('checking');
        setErrorMessage('');
        setSimulatedMode(false);
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('Webcam hardware API is not accessible in this environment.');
          }
          const mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 320 }, height: { ideal: 240 } },
            audio: false
          });
          setStream(mediaStream);
          setCameraStatus('granted');
          if (previewVideoRef.current) {
            previewVideoRef.current.srcObject = mediaStream;
          }
        } catch (err) {
          console.warn('Webcam permission error:', err);
          setCameraStatus('denied');
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            setErrorMessage('Camera access was blocked by your browser. Please click the camera or lock icon in your address bar, allow camera access, and click "Retry Permission Check".');
          } else {
            setErrorMessage(err.message || 'No video device found or camera access failed.');
          }
        }
      };

      const handleUseSimulation = () => {
        const simStream = createVirtualProctorStream();
        setStream(simStream);
        setSimulatedMode(true);
        setCameraStatus('granted');
        if (previewVideoRef.current) {
          previewVideoRef.current.srcObject = simStream;
        }
      };

      useEffect(() => {
        requestRealCamera();
      }, []);

      const handleStartProctoredAssessment = async () => {
        if (!acknowledgedRules) {
          alert('Please review and check the Proctoring Integrity Acknowledgment before proceeding.');
          return;
        }
        if (cameraStatus !== 'granted' || !stream) {
          alert('Camera verification is mandatory before launching the proctored arena.');
          return;
        }

        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          }
        } catch (e) {
          console.warn('Fullscreen request fallback:', e);
        }

        onProceed(stream);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 animate-fade-in font-sans">

                ✕ Cancel
              </button>
            </div>

            <div className="mt-6 space-y-4">
              {/* Target Test Meta */}
              <div className="p-3.5 bg-slate-800/60 rounded-2xl border border-slate-700 flex items-center justify-between text-xs">

                    <div className="flex flex-wrap gap-2">

                        🔄 Retry Camera Permission

                      <button

                        className="px-3.5 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-indigo-200 font-bold text-xs border border-slate-600 transition"

                        🛡️ Use Simulated Proctor Camera (Test Mode)
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Step 2: Fullscreen & Anti-Cheating Guidelines */}
              <div className="p-4 bg-slate-800/80 rounded-2xl border border-slate-700 space-y-2.5 text-xs text-slate-300">
                <span className="font-black uppercase tracking-wider text-slate-200 block mb-1">
                  🖥️ 2. Mandatory Fullscreen &amp; 3-Strike System
                </span>
                <ul className="space-y-1.5 text-slate-400 text-[11px] list-disc pl-4 leading-relaxed">
                  <li><strong>Fullscreen Lock:</strong> Native fullscreen is enforced. Exiting fullscreen freezes the test and counts as 1 strike.</li>
                  <li><strong>Tab Switches &amp; Window Blur:</strong> Navigating away from this tab or minimizing the window triggers an automatic violation.</li>
                  <li><strong>3-Strike Rule:</strong> Violations 1 &amp; 2 display a mandatory warning. Strike 3 triggers <strong>immediate disqualification and auto-submission</strong>.</li>
                  <li><strong>Clipboard &amp; Shortcuts:</strong> Right-click, Copy/Paste, DevTools (F12, Inspect), and text selection are disabled.</li>
                </ul>

                <label className="flex items-start gap-2.5 pt-2 border-t border-slate-700/60 cursor-pointer select-none">
                  <input
                    type="checkbox"
                    checked={acknowledgedRules}
                    onChange={(e) => setAcknowledgedRules(e.target.checked)}
                    className="mt-0.5 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 w-4 h-4 bg-slate-900 cursor-pointer"
                  />
                  <span className="text-[11px] font-bold text-slate-200">
                    I acknowledge that I am in a quiet environment, consent to continuous webcam monitoring, and accept the 3-strike integrity policy.
                  </span>
                </label>
              </div>
            </div>

            {/* Launch Action */}
            <div className="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-800">
              <button
                onClick={onCancel}
                className="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition"
              >
                Exit to Modules
              </button>
              <button
                onClick={handleStartProctoredAssessment}
                disabled={cameraStatus !== 'granted' || !acknowledgedRules}
                className={`px-6 py-3 rounded-xl font-black text-xs shadow-lg transition flex items-center gap-2 ${cameraStatus === 'granted' && acknowledgedRules
                  ? 'bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white cursor-pointer transform active:scale-98'
                  : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                  }`}
              >
                <span>🔒 Enable Fullscreen &amp; Enter Arena →</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. TOPIC ARENA: PRACTICE MODE (UNTIMED) & PROCTORED TIMED TEST ARENA
    // =========================================================================
    function TopicArena({ slug, onBack, onBookmarkUpdated }) {
      const [topicInfo, setTopicInfo] = useState(null);
      const [mode, setMode] = useState('practice'); // 'practice' | 'timed'
      const [loading, setLoading] = useState(true);

      // Practice Mode State
      const [practiceQuestions, setPracticeQuestions] = useState([]);
      const [page, setPage] = useState(1);
      const [totalPages, setTotalPages] = useState(5);
      const [selectedAnswers, setSelectedAnswers] = useState({}); // { [qId]: optionIndex }
      const [openExplanations, setOpenExplanations] = useState({}); // { [qId]: boolean }

      // Timed Test Mode State
      const [testSetup, setTestSetup] = useState({ questionCount: 20, durationMinutes: 30 });
      const [showPreFlightModal, setShowPreFlightModal] = useState(false);
      const [activeMediaStream, setActiveMediaStream] = useState(null);
      const [testStarted, setTestStarted] = useState(false);
      const [timedQuestions, setTimedQuestions] = useState([]);
      const [testSubmitted, setTestSubmitted] = useState(false);
      const [testResults, setTestResults] = useState(null);

      // Load Topic Questions
      const fetchQuestions = useCallback(async (targetMode = 'practice', targetPage = 1, targetCount = 20) => {
        setLoading(true);
        const token = localStorage.getItem('portal_auth_token');

        try {
          const url = `/api/topics/${slug}/questions?mode=${targetMode}&page=${targetPage}&limit=${targetCount}`;
          const res = await fetch(url, {
            headers: token ? { 'Authorization': `Bearer ${token}` } : {}
          });
          const data = await res.json();

          if (data.topic) setTopicInfo(data.topic);

          if (targetMode === 'practice') {
            setPracticeQuestions(data.questions || []);
            setTotalPages(data.totalPages || 5);
          } else {
            setTimedQuestions(data.questions || []);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      }, [slug]);

      useEffect(() => {
        fetchQuestions('practice', page, 10);
      }, [fetchQuestions, page]);

      // Handle Option Click in Practice Mode
      const handleSelectPracticeOption = async (qId, optionIdx, correctOpt) => {
        setSelectedAnswers(prev => ({ ...prev, [qId]: optionIdx }));
        setOpenExplanations(prev => ({ ...prev, [qId]: true }));

        const token = localStorage.getItem('portal_auth_token');
        if (token) {
          fetch(`/api/topics/${slug}/progress`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ completedCount: 1 })
          }).catch(() => { });
        }
      };

      // Toggle Bookmark
      const handleToggleBookmark = async (q) => {
        const token = localStorage.getItem('portal_auth_token');
        if (!token) return;

        try {
          const res = await fetch('/api/bookmarks/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
              questionId: q.id,
              questionText: q.question_text,
              topicSlug: slug,
              options: q.options,
              correctOption: q.correct_option,
              explanation: q.explanation
            })
          });
          const data = await res.json();
          setPracticeQuestions(prev => prev.map(item =>
            item.id === q.id ? { ...item, is_bookmarked: data.isBookmarked } : item
          ));
          if (onBookmarkUpdated) onBookmarkUpdated();
        } catch (err) {
          console.error(err);
        }
      };

      // Initiate Timed Test (Opens Pre-Flight Checklist)
      const handleInitiateTimedArena = async () => {
        await fetchQuestions('timed', 1, testSetup.questionCount);
        setShowPreFlightModal(true);
      };

      // Pre-Flight passed callback
      const handlePreFlightPassed = (stream) => {
        setActiveMediaStream(stream);
        setShowPreFlightModal(false);
        setTestStarted(true);
        setTestSubmitted(false);
        setTestResults(null);
      };

      // Handle Submit Timed Test to /api/assessment/submit
      const handleSubmitTimedTest = async ({ answers, timeTakenSeconds, integrityReport }) => {
        const token = localStorage.getItem('portal_auth_token');
        try {
          const res = await fetch('/api/assessment/submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              topicSlug: slug,
              testId: slug,
              userAnswers: answers,
              timeTakenSeconds,
              questionsList: timedQuestions,
              integrityReport
            })
          });
          const data = await res.json();
          setTestResults(data);
          setTestSubmitted(true);
          setTestStarted(false);
        } catch (err) {
          console.error(err);
        }

              {/* Main Score & Parameters Summary */}
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-100">
                <div>
                  <span className="text-xs font-black uppercase text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full">

                    <div className="bg-white p-2.5 rounded-xl border border-slate-200">

              {/* Weak Areas Feedback */}
              {testResults.weakAreas?.length > 0 && (

                        }`}>
                        {item.isCorrect ? '✓ Correct' : '✕ Incorrect'}
                      </span>
                    </div>
                    <p className="font-bold text-slate-900 text-sm mb-3">{item.questionText}</p>

                >
                  Return to Practice Mode
                </button>
                <button
                  onClick={handleInitiateTimedArena}
                  className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-sm"
