    // =========================================================================
    // 5. SECURE BROWSER-BASED PROCTORED TEST ARENA COMPONENT
    // =========================================================================
    function TimedTestArena({ questions = [], durationMinutes = 30, topicName, company, testId, mediaStream, onSubmit, onCancel }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [flagged, setFlagged] = useState({});
      const [timeLeft, setTimeLeft] = useState(durationMinutes * 60);
      const [submitted, setSubmitted] = useState(false);

      // Proctoring Integrity States
      const [strikes, setStrikes] = useState(0);
      const [tabSwitchCount, setTabSwitchCount] = useState(0);
      const [fullscreenExitCount, setFullscreenExitCount] = useState(0);
      const [violationLogs, setViolationLogs] = useState([]);
      const [showStrikeWarningModal, setShowStrikeWarningModal] = useState(false);
      const [currentStrikeInfo, setCurrentStrikeInfo] = useState({ strike: 0, reason: '' });
      const [showFullscreenModal, setShowFullscreenModal] = useState(!document.fullscreenElement);
      const [isFullscreenActive, setIsFullscreenActive] = useState(Boolean(document.fullscreenElement));
      const [cameraInterrupted, setCameraInterrupted] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      const [isDisqualified, setIsDisqualified] = useState(false);

      const videoRef = useRef(null);
      const strikesRef = useRef(0);
      const submittedRef = useRef(false);
      const toastTimeoutRef = useRef(null);

      const currentQ = questions[currentIndex] || { question_text: 'Loading question...', options: [] };

      // Connect video stream & monitor stream continuity
      useEffect(() => {
        if (videoRef.current && mediaStream) {
          videoRef.current.srcObject = mediaStream;
          videoRef.current.play().catch(e => console.warn('Video autoPlay fallback:', e));
        }

        if (mediaStream) {
          const videoTrack = mediaStream.getVideoTracks()[0];
          if (videoTrack) {
            videoTrack.onended = () => {
              setCameraInterrupted(true);
            };
          }
        }
      }, [mediaStream]);

      const showSecurityToast = (msg) => {
        setToastMessage(msg);
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        toastTimeoutRef.current = setTimeout(() => setToastMessage(''), 2500);
      };

      // Force submission on strike 3 or normal completion
      const handleExecuteSubmission = useCallback((forceDisqualified = false, customStrikes = null) => {
        if (submittedRef.current) return;
        submittedRef.current = true;
        setSubmitted(true);

        const finalStrikes = customStrikes !== null ? customStrikes : strikesRef.current;
        const finalStatus = forceDisqualified || finalStrikes >= 3 ? 'DISQUALIFIED_CHEATING' : 'COMPLETED_NORMALLY';

        // Clean up stream tracks
        if (mediaStream) {
          mediaStream.getTracks().forEach(t => t.stop());
        }

        // Exit fullscreen safely
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => { });
        }

        onSubmit({
          answers,
          timeTakenSeconds: (durationMinutes * 60) - timeLeft,
          integrityReport: {
            tabSwitchCount,
            fullscreenExitCount,
            forcedAutoSubmit: forceDisqualified || finalStrikes >= 3,
            status: finalStatus,
            violationLogs
          }
        });
      }, [answers, durationMinutes, timeLeft, mediaStream, tabSwitchCount, fullscreenExitCount, violationLogs, onSubmit]);

      // Countdown Timer with freeze conditions
      useEffect(() => {
        if (timeLeft <= 0 && !submittedRef.current) {
          handleExecuteSubmission(false);
          return;
        }
        // Freeze timer if candidate exits fullscreen or is disqualified
        if (showFullscreenModal || !isFullscreenActive || isDisqualified) {
          return;
        }

        const timer = setInterval(() => {
          setTimeLeft(t => t - 1);
        }, 1000);
        return () => clearInterval(timer);
      }, [timeLeft, showFullscreenModal, isFullscreenActive, isDisqualified, handleExecuteSubmission]);

      // Record an integrity violation (3-Strike System)
      const recordViolation = useCallback((type, reason) => {
        if (submittedRef.current) return;

        const nextStrikes = strikesRef.current + 1;
        strikesRef.current = nextStrikes;
        setStrikes(nextStrikes);

        const newLog = {
          type,
          reason,
          timestamp: new Date().toLocaleTimeString(),
          strikeNumber: nextStrikes
        };
        setViolationLogs(prev => [...prev, newLog]);

        if (nextStrikes >= 3) {
          setIsDisqualified(true);
          // Lock screen, disable input, and trigger automatic force-submission
          handleExecuteSubmission(true, nextStrikes);
        } else {
          setCurrentStrikeInfo({ strike: nextStrikes, reason });
          setShowStrikeWarningModal(true);
        }
      }, [handleExecuteSubmission]);

      // Fullscreen Exit Prevention
      useEffect(() => {
        const handleFullscreenChange = () => {
          const isFs = Boolean(document.fullscreenElement);
          setIsFullscreenActive(isFs);

          if (!isFs && !submittedRef.current) {
            setFullscreenExitCount(c => c + 1);
            recordViolation('FULLSCREEN_EXIT', 'Exited mandatory full-screen mode.');
            setShowFullscreenModal(true);
          } else if (isFs) {
            setShowFullscreenModal(false);
          }
        };

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        return () => {
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
        };
      }, [recordViolation]);

      // Visibility & Tab Switch / Window Blur Detection
      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.hidden && !submittedRef.current) {
            setTabSwitchCount(c => c + 1);
            recordViolation('TAB_SWITCH', 'Switched browser tab or minimized window.');
          }
        };

        const handleBlur = () => {
          if (!submittedRef.current && !document.hidden && !showStrikeWarningModal && !showFullscreenModal) {
            setTabSwitchCount(c => c + 1);
            recordViolation('WINDOW_BLUR', 'Window focus lost to external application (e.g. Alt+Tab).');
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('blur', handleBlur);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('blur', handleBlur);
        };
      }, [recordViolation, showStrikeWarningModal, showFullscreenModal]);

      // Clipboard, Context Menu & Key Blockers
      useEffect(() => {
        const preventAction = (e) => {
          e.preventDefault();
          showSecurityToast('🔒 Action blocked: Clipboard operations & right-click are restricted in Timed Arena.');
        };

        const handleKeyDown = (e) => {
          // DevTools F12
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            showSecurityToast('🔒 DevTools shortcut (F12) blocked by proctoring engine.');
            return false;
          }
          // Ctrl+Shift+I / J / C
          if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
            e.preventDefault();
            showSecurityToast('🔒 Inspect element shortcut blocked by proctoring engine.');
            return false;
          }
          // Ctrl+U
          if (e.ctrlKey && ['u', 'U'].includes(e.key)) {
            e.preventDefault();
            showSecurityToast('🔒 View Source shortcut blocked by proctoring engine.');
            return false;
          }
          // Ctrl+C, Ctrl+V, Ctrl+A
          if (e.ctrlKey && ['c', 'v', 'a', 'C', 'V', 'A'].includes(e.key)) {
            e.preventDefault();
            showSecurityToast('🔒 Copy, Paste, and Select-All shortcuts disabled.');
            return false;
          }
        };

        window.addEventListener('contextmenu', preventAction);
        window.addEventListener('copy', preventAction);
        window.addEventListener('cut', preventAction);
        window.addEventListener('paste', preventAction);
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('contextmenu', preventAction);
          window.removeEventListener('copy', preventAction);
          window.removeEventListener('cut', preventAction);
          window.removeEventListener('paste', preventAction);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      // Countdown Timer Color Thresholds: Green (>5m) -> Yellow (<5m) -> Flashing Red (<1m)
      let timerBadgeStyle = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
      if (timeLeft <= 60) {
        timerBadgeStyle = 'bg-rose-500/25 border-rose-500 text-rose-300 animate-pulse-red font-black';
      } else if (timeLeft <= 300) {
        timerBadgeStyle = 'bg-amber-500/15 border-amber-500/40 text-amber-300 font-bold';
      }

      // Real-time strike badge styling
      let strikeBadgeStyle = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
      let strikeLabel = 'Infractions: 0/3 (Clean)';
      if (strikes === 1) {
        strikeBadgeStyle = 'bg-amber-500/20 text-amber-300 border-amber-500/40 font-bold';
        strikeLabel = 'Infractions: 1/3 (Warning)';
      } else if (strikes === 2) {
        strikeBadgeStyle = 'bg-orange-500/20 text-orange-300 border-orange-500/40 font-extrabold';
        strikeLabel = 'Infractions: 2/3 (Final Warning)';
      } else if (strikes >= 3) {
        strikeBadgeStyle = 'bg-rose-600/30 text-rose-200 border-rose-500 font-black animate-pulse-red';
        strikeLabel = 'Infractions: 3/3 (Disqualified)';
      }

      return (
        <div className="proctored-canvas min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none relative -m-4 md:-m-6 p-4 md:p-6">
          {/* Security Alert Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-rose-600/95 text-white px-5 py-2.5 rounded-2xl shadow-2xl text-xs font-black animate-fade-in border border-rose-400/50">
              {toastMessage}
            </div>
          )}

          {/* Camera Disconnection Critical Banner */}
          {cameraInterrupted && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-rose-900/95 text-white px-6 py-3 rounded-2xl shadow-2xl border-2 border-rose-500 flex items-center gap-3 animate-pulse select-none">
              <span className="text-xl">⚠️</span>
              <span className="text-xs font-black">
                CRITICAL WARNING: Live proctoring camera feed was disconnected or interrupted! Please restore your camera feed immediately.
              </span>
            </div>
          )}

          {/* Persistent Fixed Floating Live WebCam PiP Tile (Bottom-Right Corner) */}
          <div
            id="floating-pip-container"
            className="fixed bottom-6 right-6 z-40 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-2xl p-2 shadow-2xl transition-all select-none"
            style={{ width: '196px' }}
          >
            <div className="flex items-center justify-between w-full mb-1.5 px-1">
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse-red"></span>
                <span className="text-[9px] font-black tracking-wider text-rose-400">LIVE PROCTORING</span>
              </div>
              <span className="text-[8px] font-mono text-emerald-400 font-bold bg-emerald-950/60 px-1 rounded">ARMED</span>
            </div>
            <div className="relative w-[180px] h-[135px] rounded-xl overflow-hidden bg-black border border-slate-700 shadow-inner mx-auto">
              <video
                ref={videoRef}
                id="live-proctor-video"

                        <div
                          key={optIdx}
                          onClick={() => setAnswers(a => ({ ...a, [currentIndex]: optIdx }))}
                          className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center gap-3.5 ${isSelected

                  >
                    ← Previous

                    <button
                      id="btn-clear-response"
                      onClick={() => {
                        const next = { ...answers };
                        delete next[currentIndex];
                        setAnswers(next);
                      }}
                      className="px-3.5 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition cursor-pointer"
                    >
                      Clear Response
                    </button>

                    <button
                      id="btn-next-question"

                      disabled={currentIndex === questions.length - 1}
                      className={`px-6 py-2.5 rounded-xl text-xs font-black transition border cursor-pointer ${currentIndex === questions.length - 1
                        ? 'bg-slate-800 text-slate-600 border-slate-800 cursor-not-allowed'
                        : 'bg-indigo-600 text-white border-indigo-600 hover:bg-indigo-500 shadow-md'

              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">

                  <h4 className="text-xs font-black text-slate-300 uppercase tracking-wider">Question Palette</h4>
                  <span className="text-[10px] font-bold text-slate-400">

                  </span>
                </div>

                <div className="grid grid-cols-5 gap-2 mb-4">
                  {questions.map((_, qIdx) => {

                    const isFlg = flagged[qIdx];
                    const isCur = currentIndex === qIdx;

                    let btnStyle = 'bg-slate-800 text-slate-400 border border-slate-700/60';
                    if (isCur) {
                      btnStyle = 'ring-2 ring-indigo-400 bg-indigo-900/60 text-white font-black';
                    } else if (isFlg) {
                      btnStyle = 'bg-amber-500 text-slate-950 font-black';
                    } else if (isAns) {
                      btnStyle = 'bg-emerald-600 text-white font-bold';
                    }

                    return (
                      <button
                        key={qIdx}
                        onClick={() => setCurrentIndex(qIdx)}
                        className={`w-9 h-9 rounded-xl text-xs flex items-center justify-center transition shadow-xs cursor-pointer ${btnStyle}`}
                      >
                        {qIdx + 1}
                      </button>
                    );
                  })}
                </div>

                {/* Status Legend */}
                <div className="space-y-1.5 text-[10px] font-semibold text-slate-400 pt-3 border-t border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Answered
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Flagged for Review
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-slate-700"></span> Unvisited
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> Current
                  </div>
                </div>

                {/* Submit Assessment Button */}
                <button
                  id="btn-submit-test"
                  onClick={() => {
                    if (confirm('Are you sure you want to finish and submit your proctored assessment now?')) {
                      handleExecuteSubmission(false);
                    }
                  }}
                  className="w-full mt-5 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow-lg transition cursor-pointer"
                >
                  Submit Assessment ({Object.keys(answers).length}/{questions.length})
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BookmarksVault({ onBack, onOpenTopic }) {
      const [bookmarks, setBookmarks] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const token = localStorage.getItem('portal_auth_token');
        fetch('/api/bookmarks', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
          .then(res => res.json())
          .then(data => setBookmarks(data.bookmarks || []))
          .catch(err => console.error(err))
          .finally(() => setLoading(false));
      }, []);

      const handleRemoveBookmark = async (qId) => {
        const token = localStorage.getItem('portal_auth_token');
        try {
          await fetch('/api/bookmarks/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ questionId: qId })
          });
          setBookmarks(prev => prev.filter(b => b.question_id !== qId));
        } catch (e) {
          console.error(e);
        }
      };

      return (
        <div className="space-y-6 animate-fade-in font-sans">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                <span>🔖</span> Bookmarked Revision Vault
              </h2>
              <p className="text-xs text-slate-500 font-medium">Tricky and recurring questions saved for quick review.</p>
            </div>
            <button
              onClick={onBack}
              className="px-4 py-2 rounded-xl text-xs font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition"
            >
              ← Back to Folders
            </button>
          </div>

          {loading ? (
            <div className="py-20 text-center">
              <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
              <p className="text-xs text-slate-500">Retrieving bookmarks...</p>
            </div>
          ) : bookmarks.length === 0 ? (
            <div className="text-center py-20 bg-white rounded-3xl border border-slate-200 p-8">
              <span className="text-4xl block mb-2">📑</span>
              <h3 className="font-extrabold text-slate-800 text-sm">No Questions Bookmarked Yet</h3>
              <p className="text-xs text-slate-400 mt-1">
                While practicing any topic, click "Bookmark" on challenging problems to save them here.
              </p>
            </div>
          ) : (
            <div className="space-y-4">
              {bookmarks.map((b) => (
                <div key={b.bookmark_id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-3">
                  <div className="flex items-center justify-between text-xs">
                    <button
                      onClick={() => onOpenTopic(b.topic_slug)}
                      className="font-extrabold text-indigo-600 hover:underline flex items-center gap-1"
                    >
                      <span>📁 {b.topic_name}</span>
                      <span className="text-slate-400">({b.section_name})</span>
                    </button>
                    <button
                      onClick={() => handleRemoveBookmark(b.question_id)}
                      className="text-xs text-rose-500 hover:underline font-bold"
                    >
                      Remove
                    </button>
                  </div>
                  <p className="font-bold text-slate-900 text-sm">{b.question_text}</p>
                  <div className="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 text-xs text-slate-800">
                    <strong>💡 Solution:</strong> {b.explanation}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PlacementQuizArena({ quizData, onBack, onSubmit }) {
      const { title, subtitle, company, durationMinutes = 15, questions = [] } = quizData;
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [flagged, setFlagged] = useState({});
      const [timeLeft, setTimeLeft] = useState(durationMinutes * 60);
      const [warnings, setWarnings] = useState(0);
      const [showWarningModal, setShowWarningModal] = useState(false);
      const submittedRef = useRef(false);

      const handleFinalSubmit = useCallback(() => {
        if (submittedRef.current) return;
        submittedRef.current = true;
        onSubmit({
          answers: userAnswers,
          timeTakenSeconds: durationMinutes * 60 - timeLeft,
          tabSwitchViolations: warnings
        });
      }, [userAnswers, durationMinutes, timeLeft, warnings, onSubmit]);

      useEffect(() => {
        const handleVisChange = () => {
          if (document.hidden && !submittedRef.current) {
            setWarnings(prev => {
              const next = prev + 1;
              if (next >= 3) {
                alert('Anti-cheat limit exceeded. Your test is submitting automatically.');
                handleFinalSubmit();
              } else {
                setShowWarningModal(true);
              }
              return next;
            });
          }
        };
        document.addEventListener('visibilitychange', handleVisChange);
        return () => document.removeEventListener('visibilitychange', handleVisChange);
      }, [handleFinalSubmit]);

      useEffect(() => {
        if (timeLeft <= 0) {
          handleFinalSubmit();
          return;
        }
        const timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        return () => clearInterval(timer);
      }, [timeLeft, handleFinalSubmit]);

      const currentQ = questions[currentIndex] || { question_text: '', options: [], topic_tag: 'General' };
      const currentQId = currentQ.id;
      const chosenOpt = userAnswers[currentQId];

      const handleSelectOption = (idx) => {
        setUserAnswers(prev => ({ ...prev, [currentQId]: idx }));
      };

      const toggleFlag = () => {
        setFlagged(prev => ({ ...prev, [currentIndex]: !prev[currentIndex] }));
      };

      const formatTimer = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const answeredCount = Object.keys(userAnswers).length;

      return (
        <div className="max-w-7xl mx-auto space-y-6 font-sans animate-fade-in">
          {showWarningModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border border-rose-200">
                <span className="text-4xl block mb-2">⚠️</span>
                <h4 className="text-lg font-black text-rose-600">Tab Switch Warning!</h4>
                <p className="text-xs text-slate-600 mt-2">
                  Switching tabs, windows, or opening third-party tools during the test is strictly monitored.
                </p>
                <div className="my-3 py-1.5 px-3 bg-rose-50 text-rose-700 font-extrabold text-xs rounded-xl border border-rose-200">
                  Strike {warnings} of 3
                </div>
                <button
                  onClick={() => setShowWarningModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs"
                >
                  Resume Test
                </button>
              </div>
            </div>
          )}

          <div className="bg-white rounded-2xl p-4 md:p-6 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-xs font-black bg-indigo-100 text-indigo-800 px-2.5 py-0.5 rounded-md">
                  {company || 'Practice Assessment'}
                </span>
                <span className="text-xs text-slate-400 font-semibold">• Live Assessment</span>
              </div>
              <h2 className="text-xl md:text-2xl font-black text-slate-900 tracking-tight">{title}</h2>
              <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>
            </div>

            <div className="flex items-center gap-4">
              <div className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-mono text-base font-black border ${timeLeft < 120 ? 'bg-rose-50 text-rose-600 border-rose-200 animate-pulse' : 'bg-slate-100 text-slate-800 border-slate-200'
                }`}>
                <span>⏱️</span>
                <span>{formatTimer(timeLeft)}</span>
              </div>

              <button
                onClick={() => {
                  if (confirm('Are you sure you want to finish and submit your test?')) {
                    handleFinalSubmit();
                  }
                }}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-6 py-2.5 rounded-xl text-xs shadow-md transition"
              >
                Submit Test ({answeredCount}/{questions.length})
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div className="lg:col-span-3 bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-xs space-y-6 flex flex-col justify-between min-h-[500px]">
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">
                      Question {currentIndex + 1} of {questions.length}
                    </span>
                    <span className="text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-md">
                      🏷️ {currentQ.topic_tag || currentQ.sub_category || 'Topic'}
                    </span>
                  </div>
                  <button
                    onClick={toggleFlag}
                    className={`text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 ${flagged[currentIndex] ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                      }`}
                  >
                    <span>🚩</span>
                    <span>{flagged[currentIndex] ? 'Flagged for Review' : 'Flag Question'}</span>
                  </button>
                </div>

                <div className="py-6">
                  <h3 className="text-base md:text-lg font-bold text-slate-900 leading-relaxed">
                    {currentQ.question_text}
                  </h3>
                </div>

                <div className="space-y-3">
                  {(currentQ.options || []).map((opt, oIdx) => {
                    const isSelected = chosenOpt === oIdx;
                    const optLetter = String.fromCharCode(65 + oIdx);
                    return (
                      <button
                        key={oIdx}
                        onClick={() => handleSelectOption(oIdx)}
                        className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center gap-3.5 group ${isSelected
                          ? 'border-indigo-600 bg-indigo-50/70 text-indigo-950 font-bold shadow-xs'
                          : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50/80 text-slate-800'
                          }`}
                      >
                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs transition ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 group-hover:bg-slate-200'
                          }`}>
                          {optLetter}
                        </div>
                        <span className="text-sm flex-1">{opt}</span>
                        {isSelected && (
                          <span className="text-indigo-600 text-sm font-black">✓</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="flex items-center justify-between pt-6 border-t border-slate-100">
                <button
                  onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))}
                  disabled={currentIndex === 0}
                  className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 transition"
                >
                  ← Previous
                </button>
                <span className="text-xs text-slate-400 font-bold">
                  {answeredCount} Answered • {questions.length - answeredCount} Remaining
                </span>
                <button
                  onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))}
                  disabled={currentIndex === questions.length - 1}
                  className="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs disabled:opacity-40 disabled:cursor-not-allowed transition"
                >
                  Next →
                </button>
              </div>
            </div>

            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-xs space-y-6 h-fit">
              <div>
                <h4 className="font-black text-slate-800 text-sm mb-1">Question Palette</h4>
                <p className="text-[11px] text-slate-400">Click any box to jump directly to question.</p>
              </div>

              <div className="grid grid-cols-5 gap-2">
                {questions.map((q, idx) => {
                  const isAnswered = userAnswers[q.id] !== undefined;
                  const isFlagged = flagged[idx];
                  const isCurrent = idx === currentIndex;

                  let style = 'bg-slate-100 text-slate-600 border-slate-200';
                  if (isCurrent) {
                    style = 'bg-indigo-600 text-white font-black ring-2 ring-indigo-400';
                  } else if (isFlagged) {
                    style = 'bg-amber-100 text-amber-800 font-bold border-amber-300';
                  } else if (isAnswered) {
                    style = 'bg-emerald-100 text-emerald-800 font-bold border-emerald-300';
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => setCurrentIndex(idx)}
                      className={`h-9 rounded-xl text-xs flex items-center justify-center transition border ${style}`}
                    >
                      {idx + 1}
                    </button>
                  );
                })}
              </div>

              <div className="pt-4 border-t border-slate-100 space-y-2 text-[11px] font-semibold text-slate-600">
                <div className="flex items-center gap-2">
                  <span className="w-3.5 h-3.5 rounded-md bg-emerald-100 border border-emerald-300"></span>
                  <span>Answered</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3.5 h-3.5 rounded-md bg-amber-100 border border-amber-300"></span>
                  <span>Flagged for Review</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3.5 h-3.5 rounded-md bg-slate-100 border border-slate-200"></span>
                  <span>Not Answered</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3.5 h-3.5 rounded-md bg-indigo-600"></span>
                  <span>Current</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

      const [filterCompany, setFilterCompany] = useState('all');
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      const loadData = useCallback(() => {
        setLoading(true);
        const userId = currentUser ? currentUser.id : '';
        const p1 = fetch(`/api/mock-test/companies?userId=${userId}`).then(r => r.json());
        const p2 = fetch(`/api/mock-test/history?userId=${userId}`).then(r => r.json());

        Promise.all([p1, p2])
          .then(([compData, histData]) => {
            if (compData.companies) setCompanies(compData.companies);
            if (histData.history) setHistory(histData.history);
          })
          .catch(err => {
            console.error('Error fetching mock arena data:', err);
          })
          .finally(() => setLoading(false));
      }, [currentUser]);

      useEffect(() => {
        loadData();
      }, [loadData]);

      const handleResetHistory = async (companyName) => {
        try {
          const userId = currentUser ? currentUser.id : null;
          const res = await fetch('/api/mock-test/reset-history', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ companyName, userId })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);

          showToast(`✅ PYQ history for ${companyName} has been reset. All unique questions are freshly available!`);
          setResetModalCompany(null);
          loadData();
        } catch (err) {
          alert('Error resetting history: ' + err.message);
        }
      };

      const handleStartAttempt = (company) => {
        if (company.remainingUnattempted === 0) {
          setExhaustionPrompt(company);
        } else {
          onStartMock(company.companyName);
        }
      };

      const companyConfigs = {
        'TCS NQT': {
          badge: 'TCS NQT 2025 Blueprint',
          color: 'from-indigo-600 via-blue-600 to-indigo-800',
          borderHover: 'hover:border-indigo-400',
          accentColor: 'text-indigo-700 bg-indigo-50 border-indigo-200',
          icon: '🏛️',
          subtitle: 'National Qualifier Test • Digital & Ninja Profile Hiring',
          criteria: 'Sectional & Overall Cut-off: ~65%'
        },
        'Infosys': {
          badge: 'Infosys Springboard Pattern',
          color: 'from-sky-600 via-cyan-600 to-blue-700',
          borderHover: 'hover:border-sky-400',
          accentColor: 'text-sky-700 bg-sky-50 border-sky-200',
          icon: '💎',
          subtitle: 'Springboard / DSE • Systems Engineer & Specialist',
          criteria: 'Sectional Cut-off: ~70% across all sections'
        },
        'Cognizant': {
          badge: 'Cognizant GenC / GenC Next',
          color: 'from-teal-600 via-cyan-700 to-blue-800',
          borderHover: 'hover:border-teal-400',
          accentColor: 'text-teal-700 bg-teal-50 border-teal-200',
          icon: '⚡',
          subtitle: 'GenC & GenC Next Assessment • Programming & SQL',
          criteria: 'Sectional & Overall Cut-off: ~65%'
        },
        'Wipro': {
          badge: 'Wipro Elite NTH Blueprint',
          color: 'from-purple-600 via-violet-600 to-indigo-800',
          borderHover: 'hover:border-purple-400',
          accentColor: 'text-purple-700 bg-purple-50 border-purple-200',
          icon: '🚀',
          subtitle: 'Elite National Talent Hunt • Turbo Hiring Pattern',
          criteria: 'Overall Cut-off: ~60% with coding baseline'
        },
        'Accenture': {
          badge: 'Accenture Assessment 2025',
          color: 'from-rose-600 via-pink-600 to-purple-800',
          borderHover: 'hover:border-rose-400',
          accentColor: 'text-rose-700 bg-rose-50 border-rose-200',
          icon: '🎯',
          subtitle: 'Cognitive & Technical Assessment • Cloud & Pseudocode',
          criteria: 'Sectional & Overall Cut-off: ~65%'
        }
      };

      const filteredCompanies = filterCompany === 'all'
        ? companies
        : companies.filter(c => c.companyName === filterCompany);

            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">

                  <div className="p-3 my-3 bg-amber-50 rounded-xl border border-amber-200 text-xs text-amber-900 font-semibold">

                  >
                    <span>🔄 Reset History &amp; Start Clean Mock Test</span>
                  </button>
                  <button
                    onClick={() => {
                      const comp = exhaustionPrompt.companyName;
                      setExhaustionPrompt(null);
                      onStartMock(comp);

                    className="w-full py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs transition flex items-center justify-center gap-2 cursor-pointer"

                    <span>🎲 Take AI-Reshuffled Revision Test</span>

                  <button

                  >

                  </button>
                </div>
              </div>
            </div>

          {/* Reset Confirmation Modal */}
          {resetModalCompany && (

                Company Placement Mock Test Arena

              <p className="text-slate-300 text-xs md:text-sm mt-1.5 leading-relaxed">
                Take authentic full-length recruitment simulations matching the exact blueprints of <strong>TCS NQT, Infosys, Cognizant, Wipro, and Accenture</strong>. Every test paper is dynamically assembled from 2022–2025 previous-year questions (PYQs) strictly excluding questions you have attempted before.
              </p>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6">
                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10 text-center">
                  <span className="text-xs text-indigo-200 block font-semibold">Recruiters Supported</span>
                  <span className="text-2xl font-black text-white font-mono mt-0.5 block">5 Top IT</span>
                </div>
                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10 text-center">
                  <span className="text-xs text-indigo-200 block font-semibold">Question Rotation</span>
                  <span className="text-2xl font-black text-emerald-400 font-mono mt-0.5 block">Zero-Repeat</span>
                </div>
                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10 text-center">
                  <span className="text-xs text-indigo-200 block font-semibold">Exam Proctoring</span>
                  <span className="text-2xl font-black text-amber-300 font-mono mt-0.5 block">3 Strikes</span>
                </div>
                <div className="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10 text-center">
                  <span className="text-xs text-indigo-200 block font-semibold">Diagnostics</span>
                  <span className="text-2xl font-black text-blue-300 font-mono mt-0.5 block">Sectional</span>
                </div>
              </div>
            </div>
            <div className="absolute -right-16 -top-16 w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

          {/* Filter Pills */}
          <div className="flex flex-wrap items-center gap-2">
            <button

                : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                }`}
            >
              All Recruiters ({companies.length})
            </button>
            {companies.map(c => (
              <button
                key={c.companyName}
                onClick={() => setFilterCompany(c.companyName)}
                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${filterCompany === c.companyName

                  : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'

              >

              </button>
            ))}

          {/* Companies Cards Grid */}
          {loading ? (
            <div className="py-20 text-center">
              <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
              <p className="text-xs text-slate-500 font-semibold">Loading recruiter mock test catalogs &amp; attempt history...</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredCompanies.map(c => {
                const cfg = companyConfigs[c.companyName] || {
                  badge: c.companyName,
                  color: 'from-slate-700 to-slate-900',
                  borderHover: 'hover:border-slate-400',
                  accentColor: 'text-slate-700 bg-slate-50 border-slate-200',
                  icon: '🏢',
                  subtitle: 'Campus Recruitment Mock Test',
                  criteria: 'Official Cut-off'
                };

                const attemptedPct = c.totalPyqsInDb > 0
                  ? Math.round((c.userAttemptedPyqs / c.totalPyqsInDb) * 100)
                  : 0;

                const isExhausted = c.remainingUnattempted === 0 && c.totalPyqsInDb > 0;

                return (
                  <div
                    key={c.companyName}
                    className={`bg-white rounded-3xl border border-slate-200 shadow-xs ${cfg.borderHover} hover:shadow-xl transition-all duration-200 flex flex-col justify-between overflow-hidden group`}
                  >
                    {/* Card Top Banner */}
                    <div className={`p-6 bg-gradient-to-r ${cfg.color} text-white relative`}>
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3">

                          <div>
                            <span className="text-[10px] font-black uppercase tracking-wider bg-white/20 text-white px-2.5 py-0.5 rounded-full">

                            <h3 className="text-xl font-black text-white mt-1 tracking-tight">
                              {c.companyName}

                          </div>

                      <div className="space-y-3">

                          </span>
                          <div className="flex flex-wrap gap-1.5">

    }

    // =========================================================================
    // 8. ADAPTIVE PROCTORED EXAM ARENA: TEST RUNNER COMPONENT
    // =========================================================================
    function CompanyMockArena({ session, currentUser, onSubmit, onCancel }) {
      const {
        sessionId,
        companyName,
        mockNumber = 1,
        durationMinutes = 60,
        overallCutoffPct = 65,
        sections = [],
        questions = []
      } = session;

      // Group questions by section
      const sectionNames = sections.length > 0
        ? sections.map(s => s.name)
        : Array.from(new Set(questions.map(q => q.section_name || 'General')));

      const [currentSection, setCurrentSection] = useState(sectionNames[0] || 'General');
      const [currentQIndexInSection, setCurrentQIndexInSection] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [flagged, setFlagged] = useState({});
      const [timeLeft, setTimeLeft] = useState(durationMinutes * 60);

      // Proctoring States
      const [strikes, setStrikes] = useState(0);
      const [showStrikeModal, setShowStrikeModal] = useState(false);
      const [showFullscreenModal, setShowFullscreenModal] = useState(false);
      const [showSubmitModal, setShowSubmitModal] = useState(false);
      const [cameraStatus, setCameraStatus] = useState('initializing'); // 'active' | 'simulated'
      const [cameraPipMinimized, setCameraPipMinimized] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const submittedRef = useRef(false);
      const strikesRef = useRef(0);
      const videoRef = useRef(null);
      const mediaStreamRef = useRef(null);

      // Current section questions
      const currentSectionQuestions = questions.filter(q => (q.section_name || 'General') === currentSection);
      const activeQuestion = currentSectionQuestions[currentQIndexInSection] || currentSectionQuestions[0] || questions[0];

      // Total answered counts
      const answeredCount = Object.keys(userAnswers).length;

      // Webcam Initialization
      useEffect(() => {
        let stream = null;
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
            .then(s => {
              stream = s;
              mediaStreamRef.current = s;
              setCameraStatus('active');
              if (videoRef.current) {
                videoRef.current.srcObject = s;
                videoRef.current.play().catch(() => { });
              }
            })
            .catch(() => {
              setCameraStatus('simulated');
            });
        } else {
          setCameraStatus('simulated');
        }

        return () => {
          if (stream) {
            stream.getTracks().forEach(t => t.stop());
          }
        };
      }, []);

      // Mandatory Fullscreen Request
      useEffect(() => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {
            setShowFullscreenModal(true);
          });
        }

        const handleFsChange = () => {
          if (!document.fullscreenElement && !submittedRef.current) {
            setShowFullscreenModal(true);
          } else {
            setShowFullscreenModal(false);
          }
        };

        document.addEventListener('fullscreenchange', handleFsChange);
        document.addEventListener('webkitfullscreenchange', handleFsChange);
        return () => {
          document.removeEventListener('fullscreenchange', handleFsChange);
          document.removeEventListener('webkitfullscreenchange', handleFsChange);
        };
      }, []);

      const triggerAutoSubmit = useCallback((disqualified = false) => {
        if (submittedRef.current) return;
        submittedRef.current = true;

        if (mediaStreamRef.current) {
          mediaStreamRef.current.getTracks().forEach(t => t.stop());
        }
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => { });
        }

        onSubmit({
          sessionId,
          companyName,
          userAnswers,
          timeTakenSeconds: (durationMinutes * 60) - timeLeft,
          strikes: strikesRef.current,
          forcedAutoSubmit: disqualified
        });
      }, [sessionId, companyName, userAnswers, durationMinutes, timeLeft, onSubmit]);

      // 3-Strike Tab-Switch & Blur Detection
      useEffect(() => {
        const handleViolation = (reason) => {
          if (submittedRef.current) return;
          const nextStrikes = strikesRef.current + 1;
          strikesRef.current = nextStrikes;
          setStrikes(nextStrikes);

          if (nextStrikes >= 3) {
            alert('Anti-Cheat Disqualification: 3 infractions detected (tab switch / window blur). Your exam is being submitted immediately.');
            triggerAutoSubmit(true);
          } else {
            setShowStrikeModal(true);
          }
        };

        const onVisChange = () => {
          if (document.hidden && !submittedRef.current) {
            handleViolation('TAB_SWITCH');
          }
        };

        const onBlur = () => {
          if (!submittedRef.current && !document.hidden && !showStrikeModal) {
            handleViolation('WINDOW_BLUR');
          }
        };

        document.addEventListener('visibilitychange', onVisChange);
        window.addEventListener('blur', onBlur);
        return () => {
          document.removeEventListener('visibilitychange', onVisChange);
          window.removeEventListener('blur', onBlur);
        };
      }, [showStrikeModal, triggerAutoSubmit]);

      // Timer Countdown
      useEffect(() => {
        if (timeLeft <= 0) {
          alert('Time expired! Your mock paper is being submitted automatically.');
          triggerAutoSubmit(false);
          return;
        }

        const timer = setInterval(() => {
          setTimeLeft(t => t - 1);
        }, 1000);

        return () => clearInterval(timer);
      }, [timeLeft, triggerAutoSubmit]);

      // Prevent Copy / Paste / F12 / Context Menu
      useEffect(() => {
        const showSecurityToast = (msg) => {
          setToastMsg(msg);
          setTimeout(() => setToastMsg(''), 2500);
        };

        const preventEvent = (e) => {
          e.preventDefault();
          showSecurityToast('🔒 Proctored Lock: Copying, pasting, and right-click context menu are disabled.');
        };

        const handleKey = (e) => {
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            showSecurityToast('🔒 Inspect Element (F12) is disabled during the mock test.');
            return false;
          }
          if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) {
            e.preventDefault();
            showSecurityToast('🔒 DevTools shortcut blocked.');
            return false;
          }
          if (e.ctrlKey && ['c', 'v', 'u', 'a', 'C', 'V', 'U', 'A'].includes(e.key)) {
            e.preventDefault();
            showSecurityToast('🔒 Copy, paste, and view-source shortcuts blocked.');
            return false;
          }
        };

        window.addEventListener('contextmenu', preventEvent);
        window.addEventListener('copy', preventEvent);
        window.addEventListener('paste', preventEvent);
        window.addEventListener('cut', preventEvent);
        window.addEventListener('keydown', handleKey);

        return () => {
          window.removeEventListener('contextmenu', preventEvent);
          window.removeEventListener('copy', preventEvent);
          window.removeEventListener('paste', preventEvent);
          window.removeEventListener('cut', preventEvent);
          window.removeEventListener('keydown', handleKey);
        };
      }, []);

      const formatTimer = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const handleSelectOption = (optIndex) => {
        if (!activeQuestion) return;
        setUserAnswers(prev => ({
          ...prev,
          [activeQuestion.id]: optIndex
        }));
      };

      const handleClearSelection = () => {
        if (!activeQuestion) return;
        setUserAnswers(prev => {
          const next = { ...prev };
          delete next[activeQuestion.id];
          return next;
        });
      };

      const toggleFlagCurrent = () => {
        if (!activeQuestion) return;
        setFlagged(prev => ({
          ...prev,
          [activeQuestion.id]: !prev[activeQuestion.id]
        }));
      };

      return (
        <div className="max-w-7xl mx-auto space-y-6 font-sans animate-fade-in select-none">
          {/* Security Alert Toast */}
          {toastMsg && (
            <div className="fixed top-6 right-6 z-50 bg-rose-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold border border-rose-700 animate-fade-in flex items-center gap-2">
              <span>⚠️</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Fullscreen Lockdown Modal */}
          {showFullscreenModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border border-indigo-300 space-y-4">
                <span className="text-4xl block">🔒</span>
                <h3 className="text-xl font-black text-slate-900">Mandatory Full-Screen Mode</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  The <strong>{companyName}</strong> Placement Mock Test Arena requires full-screen lockdown to safeguard assessment integrity.
                </p>
                <button
                  onClick={() => {
                    document.documentElement.requestFullscreen().then(() => {
                      setShowFullscreenModal(false);
                    }).catch(() => { });
                  }}
                  className="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs shadow-lg transition cursor-pointer"
                >
                  Enter Fullscreen to Continue Test
                </button>
              </div>
            </div>
          )}

          {/* 3-Strike Warning Modal */}
          {showStrikeModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border border-rose-300 space-y-3">
                <span className="text-4xl block">🚨</span>
                <h4 className="text-lg font-black text-rose-600">Anti-Cheat Infraction Detected!</h4>
                <p className="text-xs text-slate-600">
                  Switching tabs, minimizing the test window, or losing application focus violates proctoring policy.
                </p>
                <div className="py-2 px-4 bg-rose-50 text-rose-800 font-black text-sm rounded-xl border border-rose-200">
                  Strike {strikes} of 3
                </div>
                <p className="text-[11px] text-slate-400">
                  ⚠️ 3rd infraction triggers immediate test cancellation and zero score recording.
                </p>
                <button
                  onClick={() => setShowStrikeModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-900 text-white font-extrabold text-xs cursor-pointer hover:bg-slate-800 transition"
                >
                  I Understand, Resume Test
                </button>
              </div>
            </div>
          )}

          {/* Test Submission Summary Modal */}
          {showSubmitModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl border border-slate-200 space-y-5">
                <div className="text-center">
                  <span className="text-4xl block mb-2">📑</span>
                  <h3 className="text-xl font-black text-slate-900">Submit Exam Session?</h3>
                  <p className="text-xs text-slate-500 mt-1">Review your question summary before final grading.</p>
                </div>

                <div className="grid grid-cols-2 gap-3 text-center text-xs">
                  <div className="p-3 bg-emerald-50 rounded-2xl border border-emerald-200">
                    <span className="text-slate-500 block text-[10px] font-bold">Answered</span>
                    <span className="text-xl font-black font-mono text-emerald-700">{answeredCount}</span>
                  </div>
                  <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200">
                    <span className="text-slate-500 block text-[10px] font-bold">Remaining</span>
                    <span className="text-xl font-black font-mono text-slate-700">{questions.length - answeredCount}</span>
                  </div>
                  <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200">
                    <span className="text-slate-500 block text-[10px] font-bold">Flagged for Review</span>
                    <span className="text-xl font-black font-mono text-amber-700">
                      {Object.values(flagged).filter(Boolean).length}
                    </span>
                  </div>
                  <div className="p-3 bg-indigo-50 rounded-2xl border border-indigo-200">
                    <span className="text-slate-500 block text-[10px] font-bold">Time Remaining</span>
                    <span className="text-xl font-black font-mono text-indigo-700">{formatTimer(timeLeft)}</span>
                  </div>
                </div>

                {questions.length - answeredCount > 0 && (
                  <p className="text-xs text-amber-700 bg-amber-50 p-3 rounded-xl border border-amber-200 text-center font-medium">
                    ⚠️ You still have <strong>{questions.length - answeredCount} unanswered questions</strong>. Unanswered questions receive 0 marks.
                  </p>
                )}

                <div className="flex gap-3">
                  <button
                    onClick={() => setShowSubmitModal(false)}
                    className="flex-1 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer transition"
                  >
                    ← Continue Test
                  </button>
                  <button
                    onClick={() => {
                      setShowSubmitModal(false);
                      triggerAutoSubmit(false);
                    }}
                    className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs shadow-md transition cursor-pointer"
                  >
                    Confirm &amp; Submit Paper
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Top Exam Header with Section Tabs and Timer */}
          <div className="bg-white rounded-3xl p-5 md:p-6 border border-slate-200 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-xs font-black uppercase bg-indigo-100 text-indigo-800 px-3 py-0.5 rounded-full">
                    {companyName} • Mock #{mockNumber}
                  </span>
                  <span className="text-xs font-extrabold text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded-md">
                    🎯 Cut-off Target: {overallCutoffPct}%
                  </span>
                </div>
                <h2 className="text-xl md:text-2xl font-black text-slate-900 tracking-tight">
                  {companyName} Recruitment Simulation
                </h2>
              </div>

              {/* Countdown Timer & Submit Button */}
              <div className="flex items-center gap-3">
                <div className={`flex items-center gap-2 px-4 py-2 rounded-2xl font-mono text-lg font-black border transition ${timeLeft <= 120
                  ? 'bg-rose-50 text-rose-600 border-rose-300 animate-pulse'
                  : timeLeft <= 600
                    ? 'bg-amber-50 text-amber-700 border-amber-300'
                    : 'bg-slate-100 text-slate-800 border-slate-200'
                  }`}>
                  <span>⏱️</span>
                  <span>{formatTimer(timeLeft)}</span>
                </div>

                <button
                  onClick={() => setShowSubmitModal(true)}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-6 py-2.5 rounded-2xl text-xs shadow-md transition cursor-pointer"
                >
                  Submit Paper ({answeredCount}/{questions.length})
                </button>
              </div>
            </div>

            {/* Section Tabs */}
            <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
              {sectionNames.map(secName => {
                const secQs = questions.filter(q => (q.section_name || 'General') === secName);
                const secAnswered = secQs.filter(q => userAnswers[q.id] !== undefined).length;
                const isActive = currentSection === secName;

                return (
                  <button
                    key={secName}
                    onClick={() => {
                      setCurrentSection(secName);
                      setCurrentQIndexInSection(0);
                    }}
                    className={`px-4 py-2 rounded-2xl text-xs font-extrabold transition cursor-pointer flex items-center gap-2 border ${isActive
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                      }`}
                  >
                    <span>{secName}</span>
                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-black ${isActive ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}`}>
                      {secAnswered} / {secQs.length}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Main Layout: Question Canvas & Palette */}
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
            {/* Question Card (Col 1-3) */}
            <div className="lg:col-span-3 bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm flex flex-col justify-between min-h-[550px] space-y-6">
              {activeQuestion ? (
                <div>
                  {/* Question Top Metadata */}
                  <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-100">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-xs font-black uppercase text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">
                        {currentSection} • Q{currentQIndexInSection + 1} of {currentSectionQuestions.length}
                      </span>
                      <span className="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-lg">
                        🏷️ {activeQuestion.topic_tag || 'Concept'}
                      </span>
                      {activeQuestion.exam_year && (
                        <span className="text-xs font-bold text-slate-600 bg-slate-100 px-2 py-1 rounded-lg">
                          📅 PYQ {activeQuestion.exam_year}
                        </span>
                      )}
                      <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-lg">
                        🎯 {activeQuestion.difficulty || 'Medium'}
                      </span>
                    </div>

                    <button
                      onClick={toggleFlagCurrent}
                      className={`text-xs font-extrabold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 cursor-pointer border ${flagged[activeQuestion.id]
                        ? 'bg-amber-100 text-amber-800 border-amber-300'
                        : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                        }`}
                    >
                      <span>🚩</span>
                      <span>{flagged[activeQuestion.id] ? 'Flagged for Review' : 'Flag Question'}</span>
                    </button>
                  </div>

                  {/* Question Text */}
                  <div className="py-6">
                    <h3 className="text-base md:text-lg font-bold text-slate-900 leading-relaxed font-sans whitespace-pre-line">
                      {activeQuestion.question_text}
                    </h3>
                  </div>

                  {/* 4 Options Selection */}
                  <div className="space-y-3">
                    {(activeQuestion.options || []).map((opt, oIdx) => {
                      const isSelected = userAnswers[activeQuestion.id] === oIdx;
                      const optLetter = String.fromCharCode(65 + oIdx);

                      return (
                        <button
                          key={oIdx}
                          onClick={() => handleSelectOption(oIdx)}
                          className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center gap-3.5 group cursor-pointer ${isSelected
                            ? 'border-indigo-600 bg-indigo-50/80 text-indigo-950 font-bold shadow-xs'
                            : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50/80 text-slate-800'
                            }`}
                        >
                          <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-black text-xs transition ${isSelected
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-100 text-slate-600 group-hover:bg-slate-200'
                            }`}>
                            {optLetter}
                          </div>
                          <span className="text-sm flex-1 leading-snug">{opt}</span>
                          {isSelected && (
                            <span className="text-indigo-600 text-sm font-black">✓ Selected</span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ) : (
                <div className="text-center py-20 text-slate-400">Loading question...</div>
              )}

              {/* Bottom Nav Buttons */}
              <div className="flex flex-wrap items-center justify-between gap-3 pt-6 border-t border-slate-100">
                <button
                  onClick={() => setCurrentQIndexInSection(p => Math.max(0, p - 1))}
                  disabled={currentQIndexInSection === 0}
                  className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 transition cursor-pointer"
                >
                  ← Previous
                </button>

                {activeQuestion && userAnswers[activeQuestion.id] !== undefined && (
                  <button
                    onClick={handleClearSelection}
                    className="text-xs text-slate-500 hover:text-rose-600 font-bold hover:underline cursor-pointer"
                  >
                    Clear Response
                  </button>
                )}

                <button
                  onClick={() => {
                    if (currentQIndexInSection < currentSectionQuestions.length - 1) {
                      setCurrentQIndexInSection(p => p + 1);
                    } else {
                      // Switch to next section if available
                      const nextSecIdx = sectionNames.indexOf(currentSection) + 1;
                      if (nextSecIdx < sectionNames.length) {
                        setCurrentSection(sectionNames[nextSecIdx]);
                        setCurrentQIndexInSection(0);
                      }
                    }
                  }}
                  className="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-extrabold text-xs transition cursor-pointer"
                >
                  {currentQIndexInSection < currentSectionQuestions.length - 1 ? 'Next Question →' : 'Next Section →'}
                </button>
              </div>
            </div>

            {/* Right Column: Proctor PIP Feed & Question Palette */}
            <div className="space-y-6">
              {/* Webcam PIP Floating/Docked Box */}
              <div className="bg-slate-900 rounded-3xl p-4 text-white shadow-xl border border-slate-800 space-y-2">
                <div className="flex items-center justify-between text-xs pb-2 border-b border-slate-800">
                  <span className="font-black text-emerald-400 flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>AI PROCTOR ACTIVE</span>
                  </span>
                  <button
                    onClick={() => setCameraPipMinimized(!cameraPipMinimized)}
                    className="text-slate-400 hover:text-white text-xs font-bold"
                  >
                    {cameraPipMinimized ? 'Expand ↗' : 'Minimize ↘'}
                  </button>
                </div>

                {!cameraPipMinimized && (
                  <div className="relative rounded-2xl overflow-hidden bg-black aspect-video flex items-center justify-center border border-slate-800">
                    {cameraStatus === 'active' ? (
                      <video
                        ref={videoRef}
                        autoPlay
                        playsInline
                        muted
                        className="w-full h-full object-cover transform -scale-x-100"
                      />
                    ) : (
                      <div className="text-center p-3 space-y-1">
                        <div className="w-8 h-8 rounded-full border-2 border-emerald-400 border-t-transparent animate-spin mx-auto"></div>
                        <span className="text-[10px] text-emerald-300 block font-mono">EYE-GAZE RADAR ACTIVE</span>
                        <span className="text-[9px] text-slate-500 block">Candidate Identity Verified</span>
                      </div>
                    )}
                    <div className="absolute bottom-2 left-2 bg-black/60 backdrop-blur-xs text-[10px] px-2 py-0.5 rounded text-slate-300 font-mono">
                      {currentUser?.fullName || 'Candidate'} • 30 FPS
                    </div>
                  </div>
                )}
              </div>

              {/* Question Navigation Palette */}
              <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                <div>
                  <h4 className="font-black text-slate-800 text-sm">{currentSection} Palette</h4>
                  <p className="text-[11px] text-slate-400">Click any number to jump directly.</p>
                </div>

                <div className="grid grid-cols-5 gap-2 max-h-60 overflow-y-auto pr-1">
                  {currentSectionQuestions.map((q, idx) => {
                    const isAnswered = userAnswers[q.id] !== undefined;
                    const isFlagged = flagged[q.id];
                    const isCurrent = idx === currentQIndexInSection;

                    let btnStyle = 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200';
                    if (isCurrent) {
                      btnStyle = 'bg-indigo-600 text-white font-black ring-2 ring-indigo-500 ring-offset-2';
                    } else if (isFlagged) {
                      btnStyle = 'bg-amber-500 text-white font-bold border-amber-600';
                    } else if (isAnswered) {
                      btnStyle = 'bg-emerald-600 text-white font-bold border-emerald-700';
                    }

                    return (
                      <button
                        key={q.id}
                        onClick={() => setCurrentQIndexInSection(idx)}
                        className={`h-9 rounded-xl text-xs flex items-center justify-center transition border cursor-pointer ${btnStyle}`}
                      >
                        {idx + 1}
                      </button>
                    );
                  })}
                </div>

                {/* Legend */}

        if (reviewFilter === 'incorrect') return !item.isCorrect && item.userSelected !== undefined && item.userSelected !== -1;
