    // =========================================================================
    // 10. IN-BROWSER LIVE CODING SANDBOX (COMPILER) COMPONENT
    // =========================================================================
    function LiveCodingSandbox({ onBack, currentUser }) {
      const [problems, setProblems] = useState([]);
      const [selectedProblemId, setSelectedProblemId] = useState('');
      const [selectedProblem, setSelectedProblem] = useState(null);
      const [language, setLanguage] = useState('python');
      const [code, setCode] = useState('');
      const [customInput, setCustomInput] = useState('');
      const [activeConsoleTab, setActiveConsoleTab] = useState('input'); // 'input' | 'output' | 'submission'
      const [runOutput, setRunOutput] = useState(null);
      const [submissionResult, setSubmissionResult] = useState(null);
      const [loadingRun, setLoadingRun] = useState(false);
      const [loadingSubmit, setLoadingSubmit] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      // Fetch problem list
      useEffect(() => {
        fetch('/api/compiler/problems')
          .then(r => r.json())
          .then(data => {
            if (data.problems) {
              setProblems(data.problems);
              if (data.problems.length > 0) {
                setSelectedProblemId(data.problems[0].id);
              }
            }
          })
          .catch(err => console.error(err));
      }, []);

      // Fetch problem details when selected
      useEffect(() => {
        if (!selectedProblemId) return;
        fetch(`/api/compiler/problems/${selectedProblemId}`)
          .then(r => r.json())
          .then(data => {
            if (data.problem) {
              setSelectedProblem(data.problem);
              // Set default starter code
              const starters = data.problem.starterCode || {};
              const starter = starters[language] || starters['python'] || '// Write your solution here';
              setCode(starter);
              if (data.problem.sampleTestCases && data.problem.sampleTestCases.length > 0) {
                setCustomInput(data.problem.sampleTestCases[0].input);
              }
              setRunOutput(null);
              setSubmissionResult(null);
            }
          })
          .catch(err => console.error(err));
      }, [selectedProblemId]);

      // Change language starter template
      const handleLanguageChange = (newLang) => {
        setLanguage(newLang);
        if (selectedProblem && selectedProblem.starterCode) {
          const newCode = selectedProblem.starterCode[newLang] || '// Write your solution here';
          setCode(newCode);
        }
      };

      const handleRunCode = async () => {
        setLoadingRun(true);
        setActiveConsoleTab('output');
        setRunOutput(null);
        try {
          const res = await fetch('/api/compiler/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code,
              language,
              input: customInput,
              problemId: selectedProblemId
            })
          });
          const data = await res.json();
          setRunOutput(data);
        } catch (err) {
          setRunOutput({ stderr: 'Execution request failed: ' + err.message });
        } finally {
          setLoadingRun(false);
        }
      };

      const handleSubmitSolution = async () => {
        setLoadingSubmit(true);
        setActiveConsoleTab('submission');
        setSubmissionResult(null);
        try {
          const res = await fetch('/api/compiler/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code,
              language,
              problemId: selectedProblemId,
              userId: currentUser ? currentUser.id : null
            })
          });
          const data = await res.json();
          setSubmissionResult(data);
        } catch (err) {
          setSubmissionResult({ verdict: 'ERROR', verdictTitle: 'Submission failed: ' + err.message });
        } finally {
          setLoadingSubmit(false);
        }
      };

      return (
        <div className="space-y-6 font-sans animate-fade-in">
          {toastMsg && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold border border-slate-700 animate-fade-in flex items-center gap-2">
              <span>🔔</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Top Header */}
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-2 border-b border-slate-200">
            <div>
              <div className="flex items-center gap-2 text-xs font-semibold text-slate-500 mb-1">
                <button onClick={onBack} className="hover:text-indigo-600 transition cursor-pointer">Home</button>
                <span>/</span>
                <span className="text-slate-900 font-extrabold">In-Browser Live Coding Sandbox</span>
              </div>
              <h2 className="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                <span>💻</span> Live Coding Sandbox &amp; Test Runner
              </h2>
              <p className="text-xs text-slate-500 font-medium mt-0.5">
                Practice campus technical coding rounds (TCS Advanced Coding, Infosys DSE, Cognizant) with multi-language execution and hidden edge test suites.
              </p>
            </div>

            <div className="flex items-center gap-2 w-full sm:w-auto">
              <button
                onClick={onBack}
                className="px-4 py-2 rounded-xl text-xs font-bold text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 transition shadow-2xs cursor-pointer flex items-center gap-1.5"
              >
                <span>←</span>
                <span>Back to Home</span>
              </button>
            </div>
          </div>

          {/* Problem Selector Bar */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-4">
            <div className="flex flex-wrap items-center gap-3">
              <span className="text-xs font-black uppercase tracking-wider text-slate-400">Select Problem:</span>
              <select
                value={selectedProblemId}
                onChange={(e) => setSelectedProblemId(e.target.value)}
                className="px-3.5 py-2 text-xs font-extrabold bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
              >
                {problems.map(p => (
                  <option key={p.id} value={p.id}>
                    [{p.company}] {p.title} ({p.difficulty})
                  </option>
                ))}

      const [loading, setLoading] = useState(false);
      const [pdfLoading, setPdfLoading] = useState(false);

      const handleSampleResume = () => {
        setResumeText(`Harsha Sri Reddy
Email: candidate@placement.edu | Phone: +91 9876543210 | GitHub: github.com/harshasri

EDUCATION
B.Tech in Computer Science and Engineering (2022 - 2026) | CGPA: 8.85 / 10.0

TECHNICAL SKILLS
Languages: Python, Java, C++, JavaScript, SQL
Core Competencies: Data Structures and Algorithms, Object-Oriented Programming (OOPs), DBMS, Operating Systems, Computer Networks
Frameworks & Tools: React, Node.js, Express, MongoDB, Git, GitHub, REST APIs, Postman

ACADEMIC PROJECTS
1. Hospital Patient Management Portal
- Engineered a full-stack portal managing medical appointments and records for 1,000+ active mock patients.
- Designed normalized relational database schemas in SQL and implemented JWT authentication reducing login latency by 25%.
- Built RESTful APIs using Node.js and Express; deployed frontend on Vercel with responsive TailwindCSS layout.

2. Algorithmic Pathfinding Visualizer
- Implemented Dijkstra and A* search algorithms in Python and JavaScript to visualize shortest path routing.
- Optimized graph traversal time complexity and handled obstacle grids with interactive UI.

ACHIEVEMENTS & CERTIFICATIONS
- Solved 250+ problems across LeetCode and GeeksforGeeks in Data Structures and Algorithms.
- Certified in Database Management Systems (NPTEL - Elite Silver).`);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
          setPdfLoading(true);
          try {
            const arrayBuffer = await file.arrayBuffer();
            const pdfjs = window['pdfjs-dist/build/pdf'];
            if (pdfjs) {
              pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              const loadingTask = pdfjs.getDocument({ data: arrayBuffer });
              const pdf = await loadingTask.promise;
              let fullText = '';
              for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
              }
              setResumeText(fullText.trim());
            } else {
              alert('PDF.js parser initializing. You can also paste your resume text directly below.');
            }
          } catch (err) {
            alert('Could not parse PDF text: ' + err.message + '. Please copy & paste the text directly into the box.');
          } finally {
            setPdfLoading(false);
          }
        } else {
          // Read plain text
          const reader = new FileReader();
          reader.onload = (event) => {
            setResumeText(event.target.result);
          };
          reader.readAsText(file);
        }
      };

      const handleAnalyze = async () => {
        if (!resumeText || resumeText.trim().length < 50) {
          alert('Please enter or upload at least 50 characters of resume content to analyze.');
          return;
        }

        setLoading(true);
        try {
          const res = await fetch('/api/resume/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              resumeText,
              roleId,
              customJobDescription: useCustomJD ? customJD : ''
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          setAnalysis(data);
        } catch (err) {
          alert('Error analyzing resume: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-6 font-sans animate-fade-in">

                </p>

                />

        { id: 'Wipro', name: 'Wipro', badge: 'Elite NTH / Turbo', color: 'from-teal-600 to-emerald-700', icon: '🌐' },

      ];

      // Load Candidate Past Weak Areas Preview & Past Sessions
      useEffect(() => {
        const userId = currentUser?.id || currentUser?.email || 'student-demo';
        fetch(`/api/interview/history/${userId}`)
          .then(r => r.json())
          .then(data => {
            if (data.history) setInterviewHistory(data.history);
          })
          .catch(err => console.warn('Could not load interview history:', err));

        // Setup Speech Synthesis voice preference
        if ('speechSynthesis' in window) {
          const populateVoices = () => {
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Zira'))) || voices.find(v => v.lang.startsWith('en')) || voices[0];
            activeVoiceRef.current = preferred;
          };
          populateVoices();
          window.speechSynthesis.onvoiceschanged = populateVoices;
        }
      }, [currentUser]);

      // TTS Helper: Speak AI Text Aloud
      const speakAiResponse = useCallback((text) => {
        if (!ttsEnabled || !('speechSynthesis' in window) || !text) return;
        try {
          window.speechSynthesis.cancel(); // Stop any pending speech
          const utterance = new SpeechSynthesisUtterance(text);
          if (activeVoiceRef.current) utterance.voice = activeVoiceRef.current;
          utterance.rate = 1.0;
          utterance.pitch = 1.0;

          utterance.onstart = () => setIsAiSpeaking(true);
          utterance.onend = () => setIsAiSpeaking(false);
          utterance.onerror = () => setIsAiSpeaking(false);

          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn('Speech synthesis error:', e);
          setIsAiSpeaking(false);
        }
      }, [ttsEnabled]);

      // Web Speech API Voice Recognition (STT)
      const toggleVoiceRecording = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('Speech Recognition is not supported in this browser. Please type your response directly in the text area.');
          return;
        }

        if (isListening) {
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
          setIsListening(false);
          setInterimTranscript('');
        } else {
          // Stop AI speaking if user starts talking
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          setIsAiSpeaking(false);

          try {
            const recog = new SpeechRec();
            recog.continuous = true;
            recog.interimResults = true;
            recog.lang = 'en-US';

            recog.onresult = (event) => {
              let interim = '';
              let finalTranscript = '';
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const chunk = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                  finalTranscript += chunk + ' ';
                } else {
                  interim += chunk;
                }
              }
              if (finalTranscript) {
                setCandidateAnswer(prev => (prev ? prev.trim() + ' ' : '') + finalTranscript.trim());
              }
              setInterimTranscript(interim);
            };

            recog.onerror = (e) => {
              console.warn('Speech Recognition error:', e.error);
              setIsListening(false);
              setInterimTranscript('');
            };

            recog.onend = () => {
              setIsListening(false);
              setInterimTranscript('');
            };

            recog.start();
            recognitionRef.current = recog;
            setIsListening(true);
          } catch (err) {
            alert('Microphone initialization error: ' + err.message);
            setIsListening(false);
          }
        }
      };

      // 1. Start Interview Session
      const handleStartInterview = async () => {
        setLoadingStart(true);
        try {

          const res = await fetch('/api/interview/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userId,
              company: selectedCompany,
              roundType: selectedRound
            })
          });
          const data = await res.json();
          if (!data.success) throw new Error(data.error || 'Failed to initialize session');

          setSessionId(data.sessionId);
          setCurrentQIndex(data.currentQuestionIndex);
          setTotalQs(data.totalQuestions || 6);
          setCurrentQuestion(data.question);
          setSpokenText(data.spokenText);
          setCandidateWeakAreas(data.weakAreas || []);
          setConversationLog(data.conversationLog || []);
          setCandidateAnswer('');
          setLastAnswerEval(null);
          setCompletionReport(null);
          setPhase('session');

          // Speak opening icebreaker & first question
          setTimeout(() => {
            speakAiResponse(data.spokenText);
          }, 400);
        } catch (err) {
          alert('Could not start interview session: ' + err.message);
        } finally {
          setLoadingStart(false);
        }

          setIsListening(false);

            headers: { 'Content-Type': 'application/json' },

            speakAiResponse(data.spokenText);
          }

          alert('Response error: ' + err.message);
        } finally {
          setLoadingRespond(false);
        }

                  <span className="font-bold text-white">6 Questions with Dynamic Probing</span>
                </div>
              </div>

              {/* Start Trigger */}
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2 border-t border-slate-100">
                <div className="flex items-center gap-3 text-xs text-slate-500">
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span className="font-bold text-slate-700">Web Speech STT &amp; TTS Ready</span>
                  </div>
                  <span>•</span>
                  <span>Supports Voice &amp; Fallback Typing</span>
                </div>

                <button
                  onClick={handleStartInterview}
                  disabled={loadingStart}
                  className="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-black text-sm shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
                >
                  {loadingStart ? (
                    <>
                      <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>Initializing AI Recruiter Engine...</span>
                    </>
                  ) : (
                    <>
                      <span>🎙️</span>
                      <span>Begin {selectedCompany} {selectedRound} Interview</span>
                      <span>→</span>
                    </>
                  )}
                </button>
              </div>
            </div>

            {/* History Modal */}
            {showHistoryModal && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-2xl w-full p-6 space-y-4 shadow-2xl border border-slate-200 animate-fade-in max-h-[85vh] overflow-y-auto">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                    <h3 className="font-black text-slate-900 text-lg flex items-center gap-2">
                      <span>📜</span>
                      <span>Past Interview Session Reports</span>
                    </h3>
                    <button
                      onClick={() => setShowHistoryModal(false)}
                      className="p-1 rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-700 cursor-pointer"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-3">
                    {interviewHistory.map((item, idx) => {
                      const rep = item.evaluation_report;
                      return (
                        <div
                          key={item.id || idx}
                          className="p-4 rounded-2xl bg-slate-50 border border-slate-200 hover:border-purple-300 transition flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3"
                        >
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-black text-slate-900 text-sm">{item.company_name}</span>
                              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">
                                {item.round_type}
                              </span>
                              <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${rep?.hiringRecommendation === 'Strong Hire' ? 'bg-emerald-100 text-emerald-800' :
                                rep?.hiringRecommendation === 'Hire' ? 'bg-blue-100 text-blue-800' :
                                  rep?.hiringRecommendation === 'Borderline' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'
                                }`}>
                                {rep?.hiringRecommendation || item.status}
                              </span>
                            </div>
                            <span className="text-[11px] text-slate-500 mt-1 block">
                              Completed: {new Date(item.completed_at).toLocaleDateString()} at {new Date(item.completed_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </span>
                          </div>

                          <div className="flex items-center gap-3">
                            {rep?.overallScore !== undefined && (
                              <div className="text-right">
                                <span className="text-[10px] text-slate-400 block font-bold">Overall</span>
                                <span className="text-lg font-black font-mono text-purple-700">{rep.overallScore}%</span>
                              </div>
                            )}
                            <button
                              onClick={() => {
                                if (rep) {
                                  setCompletionReport(rep);
                                  setShowHistoryModal(false);
                                  setPhase('report');
                                } else {
                                  alert('Detailed report is still generating or session was ended early.');
                                }
                              }}
                              className="px-3 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold transition cursor-pointer"
                            >
                              View Report
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // =======================================================================
      // RENDER PHASE 2: LIVE MULTI-TURN INTERVIEW ARENA (SPLIT-SCREEN)
      // =======================================================================
      if (phase === 'session') {
        const progressPct = Math.round((currentQIndex / totalQs) * 100);

        return (
          <div className="space-y-6 font-sans animate-fade-in max-w-7xl mx-auto pb-12">
            {/* Top Bar with Progress */}
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-slate-200">
              <div className="flex items-center gap-3">
                <span className="text-2xl">🎙️</span>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black uppercase tracking-wider text-purple-700 bg-purple-50 px-2.5 py-0.5 rounded-md border border-purple-200">
                      {selectedCompany} • {selectedRound}
                    </span>
                    <span className="text-xs font-bold text-slate-500">
                      Turn {currentQIndex} of {totalQs}
                    </span>
                  </div>
                </div>
              </div>

              {/* Progress & Controls */}
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <div className="w-full sm:w-48 bg-slate-200 h-2.5 rounded-full overflow-hidden">
                  <div
                    className="bg-gradient-to-r from-purple-600 to-indigo-600 h-full rounded-full transition-all duration-500"
                    style={{ width: `${progressPct}%` }}
                  ></div>
                </div>

                <button
                  onClick={() => setTtsEnabled(!ttsEnabled)}
                  title={ttsEnabled ? 'Mute AI Voice' : 'Enable AI Voice'}
                  className={`p-2 rounded-xl border text-xs font-bold transition cursor-pointer flex items-center gap-1 ${ttsEnabled
                    ? 'bg-purple-50 border-purple-300 text-purple-700'
                    : 'bg-slate-100 border-slate-200 text-slate-400'
                    }`}
                >
                  <span>{ttsEnabled ? '🔊 Voice On' : '🔇 Muted'}</span>
                </button>

                <button
                  onClick={() => {
                    if (confirm('Cancel interview session and return to selection? Your progress will not be completed.')) {
                      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                      if (recognitionRef.current) recognitionRef.current.stop();
                      setPhase('setup');
                    }
                  }}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs font-bold transition cursor-pointer"
                >
                  Exit Round
                </button>
              </div>
            </div>

            {/* Split Screen Grid */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* LEFT PANEL: AI RECRUITER STATION (Col 1-5) */}
              <div className="lg:col-span-5 space-y-4">
                <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-5">
                  {/* Recruiter Avatar Card */}
                  <div className="p-5 rounded-2xl bg-gradient-to-b from-slate-900 to-indigo-950 text-white flex flex-col items-center text-center relative overflow-hidden">
                    {/* Background Aura */}
                    <div className={`absolute inset-0 bg-radial from-purple-600/30 to-transparent transition-opacity duration-300 ${isAiSpeaking ? 'opacity-100 animate-pulse' : 'opacity-20'}`}></div>

                    {/* Avatar Ring */}
                    <div className="relative mb-3">
                      <div className={`w-20 h-20 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 p-1 flex items-center justify-center text-3xl shadow-lg transition-transform ${isAiSpeaking ? 'scale-105 ring-4 ring-purple-400/50' : ''}`}>
                        <div className="w-full h-full bg-slate-900 rounded-full flex items-center justify-center">
                          {selectedRound === 'Technical' ? '👨‍💻' : '👩‍💼'}
                        </div>
                      </div>
                      <span className={`absolute bottom-0 right-0 w-5 h-5 rounded-full border-2 border-slate-900 flex items-center justify-center text-[10px] ${isAiSpeaking ? 'bg-emerald-500 animate-ping' : 'bg-indigo-400'}`}></span>
                    </div>

                    <h4 className="font-black text-sm text-white">{selectedCompany} Senior Recruiter</h4>
                    <span className="text-[11px] text-indigo-300 font-semibold">{selectedRound} Evaluation Committee</span>

                    {/* Animated Speaking Waveform Indicator */}
                    <div className="flex items-center gap-1 mt-3 h-6">
                      {[40, 70, 100, 60, 90, 50, 80].map((height, i) => (
                        <span
                          key={i}
                          className={`w-1 rounded-full transition-all duration-200 ${isAiSpeaking
                            ? 'bg-purple-400 animate-pulse'
                            : 'bg-slate-700'
                            }`}
                          style={{
                            height: isAiSpeaking ? `${Math.max(6, Math.round(height * (0.6 + Math.random() * 0.4)))}px` : '4px',
                            animationDelay: `${i * 0.1}s`
                          }}
                        ></span>
                      ))}
                    </div>

                    <span className="text-[10px] font-mono text-slate-400 mt-1">
                      {isAiSpeaking ? '🎙️ Speaking Question...' : 'Listening / Standby'}
                    </span>
                  </div>

                  {/* Current Spoken Question Transcript Card */}
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-black uppercase tracking-wider text-purple-700 bg-purple-50 px-2 py-0.5 rounded">
                        Topic: {currentQuestion?.topic || 'Core CS'}
                      </span>
                      <button
                        onClick={() => speakAiResponse(spokenText)}
                        className="text-[11px] font-bold text-purple-700 hover:text-purple-900 flex items-center gap-1 cursor-pointer"
                      >
                        <span>🔁</span>
                        <span>Replay Voice</span>
                      </button>
                    </div>

                    {currentQuestion?.isProbe && (
                      <div className="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold flex items-center gap-2 animate-fade-in">
                        <span>⚠️</span>
                        <span>Follow-Up Probe: The interviewer is testing depth before moving to the next PYQ.</span>
                      </div>
                    )}

                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-slate-900 text-sm leading-relaxed font-semibold">
                      "{spokenText}"
                    </div>
                  </div>

                  {/* Previous Answer Evaluation Peek */}
                  {lastAnswerEval && (
                    <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2 text-xs animate-fade-in">
                      <div className="flex items-center justify-between">
                        <strong className="text-slate-800 font-black">Previous Turn Diagnostic</strong>
                        <span className="font-mono font-black text-purple-700 bg-purple-100 px-2 py-0.5 rounded">
                          Score: {lastAnswerEval.scoreOutOf10}/10
                        </span>
                      </div>
                      <div className="space-y-1 text-slate-600">
                        {lastAnswerEval.feedbackItems?.map((f, i) => (
                          <p key={i} className="leading-snug">• {f}</p>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Collapsible Conversation History Stream */}
                  {conversationLog.length > 2 && (
                    <details className="text-xs group border border-slate-200 rounded-2xl p-3 bg-white">
                      <summary className="font-bold text-slate-700 cursor-pointer flex items-center justify-between">
                        <span>💬 Full Interview Dialogue Log ({conversationLog.length} turns)</span>
                        <span className="text-slate-400 group-open:rotate-180 transition">▼</span>
                      </summary>
                      <div className="mt-3 space-y-2 max-h-48 overflow-y-auto pr-1">
                        {conversationLog.map((log, idx) => (
                          <div
                            key={idx}
                            className={`p-2.5 rounded-xl text-xs ${log.speaker === 'ai'
                              ? 'bg-purple-50/70 border border-purple-100 text-purple-900'
                              : 'bg-slate-100 text-slate-800 ml-4'
                              }`}
                          >
                            <span className="font-black block text-[10px] mb-0.5 text-slate-500 uppercase">
                              {log.speaker === 'ai' ? `🤖 ${selectedCompany} Recruiter` : '👤 Candidate (You)'}
                            </span>
                            <p className="leading-relaxed">{log.text}</p>
                          </div>
                        ))}
                      </div>
                    </details>
                  )}
                </div>
              </div>

              {/* RIGHT PANEL: CANDIDATE RESPONSE STATION (Col 6-12) */}
              <div className="lg:col-span-7 space-y-4">
                <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-5">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <label className="font-extrabold text-slate-900 text-sm flex items-center gap-2">
                      <span>Candidate Response Station</span>
                      <span className="text-[10px] font-normal text-slate-400">Speak or Type Answer</span>
                    </label>
                    <span className="text-slate-400 text-xs font-mono">
                      {candidateAnswer.split(/\s+/).filter(Boolean).length} Words Spoken
                    </span>
                  </div>

                  {/* Dual Mode: Live Speech Transcribed Wave & Preview */}
                  <div className="space-y-3">
                    {/* Mic Button & Live Wave Status */}
                    <div className="flex flex-wrap items-center justify-between gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                      <button
                        onClick={toggleVoiceRecording}
                        className={`px-5 py-3 rounded-2xl font-black text-xs transition flex items-center gap-2.5 cursor-pointer ${isListening
                          ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-lg ring-4 ring-rose-500/30 animate-pulse'
                          : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white shadow-md'
                          }`}
                      >
                        <span className="text-base">{isListening ? '⏹️' : '🎙️'}</span>
                        <span>{isListening ? 'Mute & Stop Speaking' : 'Hold to Speak / Active Mic'}</span>
                      </button>

                      {isListening ? (
                        <div className="flex items-center gap-2 text-rose-600 font-black text-xs animate-pulse">
                          <span className="w-2.5 h-2.5 rounded-full bg-rose-600"></span>
                          <span>Listening to Speech... Speak clearly</span>
                        </div>
                      ) : (
                        <span className="text-xs text-slate-400 font-semibold">
                          Click microphone or type your response below
                        </span>
                      )}
                    </div>

                    {/* Live Speech Interim Preview */}
                    {interimTranscript && (
                      <div className="p-3 rounded-xl bg-purple-50 border border-purple-200 text-purple-900 text-xs italic animate-pulse">
                        <span className="font-bold mr-1">Transcribing live:</span> {interimTranscript}...
                      </div>
                    )}

                    {/* Text Area for Typing or Editing Transcribed Speech */}
                    <div className="relative">
                      <textarea
                        value={candidateAnswer}
                        onChange={(e) => setCandidateAnswer(e.target.value)}
                        rows={8}
                        placeholder="Click 'Hold to Speak' to provide a spoken answer using Web Speech API, or type your technical explanation here directly..."
                        className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-xs md:text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-purple-500 font-sans leading-relaxed transition"
                      />
                    </div>
                  </div>

                  {/* Submission Controls */}
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                    <div className="text-[11px] text-slate-400">
                      💡 Tip: Aim for 40–80 words with core concepts to maximize depth.
                    </div>

                    <button
                      onClick={handleSendAnswer}
                      disabled={loadingRespond || (!candidateAnswer.trim() && !interimTranscript)}
                      className="w-full sm:w-auto px-7 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-black text-xs shadow-md transition flex items-center justify-center gap-2 cursor-pointer disabled:opacity-40"
                    >
                      {loadingRespond ? (
                        <>
                          <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                          <span>Evaluating Turn...</span>
                        </>
                      ) : (
                        <>
                          <span>⚡</span>
                          <span>Submit &amp; Next Turn →</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // =======================================================================
      // RENDER PHASE 3: COMPLETION MODAL & PERFORMANCE EVALUATION MATRIX
      // =======================================================================
      if (phase === 'report' && completionReport) {
        const rep = completionReport;
        const score = rep.overallScore || 0;
        let badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-300';
        if (rep.hiringRecommendation === 'Hire') badgeColor = 'bg-blue-100 text-blue-800 border-blue-300';
        else if (rep.hiringRecommendation === 'Borderline') badgeColor = 'bg-amber-100 text-amber-800 border-amber-300';
        else if (rep.hiringRecommendation === 'Reject') badgeColor = 'bg-rose-100 text-rose-800 border-rose-300';

        const activeItem = rep.breakdown?.[activeTabReviewIndex] || rep.breakdown?.[0];

        return (
          <div className="space-y-6 font-sans animate-fade-in max-w-6xl mx-auto pb-16">
            {/* Header */}
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-3 border-b border-slate-200">
              <div>
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Placement Simulation Complete</span>
                <h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight flex items-center gap-2 mt-0.5">
                  <span>🏆</span>
                  <span>{rep.targetCompany} {rep.roundType} Interview Evaluation</span>
                </h2>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setPhase('setup')}
                  className="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-xs shadow-md transition cursor-pointer"
                >
                  Take Another Round
                </button>
                <button
                  onClick={onBack}
                  className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-xs transition cursor-pointer"
                >
                  Return to Home
                </button>
              </div>
            </div>

            {/* Scorecard Hero */}
            <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-stretch">
              {/* Circular Overall Score Gauge (Col 1-4) */}
              <div className="md:col-span-4 bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center space-y-4">
                <span className="text-xs font-extrabold uppercase tracking-wider text-slate-400">Recruiter Composite Score</span>

                {/* Circular Indicator */}
                <div className="relative w-36 h-36 flex items-center justify-center">
                  <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle
                      cx="50"
                      cy="50"
                      r="40"
                      stroke="#f1f5f9"
                      strokeWidth="10"
                      fill="transparent"
                    />
                    <circle
                      cx="50"
                      cy="50"
                      r="40"
                      stroke={score >= 80 ? '#10b981' : score >= 65 ? '#3b82f6' : score >= 50 ? '#f59e0b' : '#ef4444'}
                      strokeWidth="10"
                      strokeDasharray={2 * Math.PI * 40}
                      strokeDashoffset={2 * Math.PI * 40 * (1 - score / 100)}
                      strokeLinecap="round"
                      fill="transparent"
                      className="transition-all duration-1000 ease-out"
                    />
                  </svg>
                  <div className="absolute flex flex-col items-center">
                    <span className="text-4xl font-black font-mono text-slate-900">{score}</span>
                    <span className="text-[10px] font-bold text-slate-400">OUT OF 100</span>
                  </div>
                </div>

                {/* Hiring Recommendation Badge */}
                <div className={`px-4 py-2 rounded-2xl border text-xs font-black uppercase tracking-wider ${badgeColor}`}>
                  Recommendation: {rep.hiringRecommendation}
                </div>
              </div>

              {/* Strengths & Improvement Areas (Col 5-12) */}
              <div className="md:col-span-8 bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6">
                {/* Strengths */}
                <div>
                  <h4 className="font-black text-slate-900 text-sm flex items-center gap-2 mb-3">
                    <span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold">✓</span>
                    <span>Key Candidate Strengths</span>
                  </h4>
                  <div className="space-y-2">
                    {rep.strengths?.map((s, i) => (
                      <div key={i} className="p-3 rounded-xl bg-emerald-50/70 border border-emerald-100 text-xs text-emerald-950 font-medium leading-relaxed">
                        {s}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Areas to Improve */}
                <div>
                  <h4 className="font-black text-slate-900 text-sm flex items-center gap-2 mb-3">
                    <span className="w-5 h-5 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold">💡</span>
                    <span>Actionable Improvements for Campus Drives</span>
                  </h4>
                  <div className="space-y-2">
                    {rep.areasToImprove?.map((a, i) => (
                      <div key={i} className="p-3 rounded-xl bg-amber-50/70 border border-amber-100 text-xs text-amber-950 font-medium leading-relaxed">
                        {a}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Question Breakdown & Model STAR Answers */}
            <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-sm space-y-6">
              <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                <h4 className="font-black text-slate-900 text-base flex items-center gap-2">
                  <span>📖</span>
                  <span>Turn-by-Turn Question Breakdown &amp; Benchmark Answers</span>
                </h4>
                <span className="text-xs text-slate-400 font-semibold">{rep.breakdown?.length || 6} Questions Evaluated</span>
              </div>

              {/* Tabs for Questions 1 to 6 */}
              <div className="flex flex-wrap gap-2">
                {rep.breakdown?.map((item, idx) => (
                  <button
                    key={idx}
                    onClick={() => setActiveTabReviewIndex(idx)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-black transition cursor-pointer flex items-center gap-1.5 ${activeTabReviewIndex === idx
                      ? 'bg-purple-600 text-white shadow-sm'
                      : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      }`}
                  >
                    <span>Q{idx + 1}</span>
                    <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${item.scoreOutOf10 >= 8 ? 'bg-emerald-500 text-white' : item.scoreOutOf10 >= 6 ? 'bg-indigo-500 text-white' : 'bg-amber-500 text-white'}`}>
                      {item.scoreOutOf10}/10
                    </span>
                  </button>
                ))}
              </div>

              {/* Active Question Review Panel */}
              {activeItem && (
                <div className="space-y-5 animate-fade-in">
                  <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-black uppercase text-purple-700 bg-purple-100 px-2 py-0.5 rounded">
                        Topic: {activeItem.topic}
                      </span>

        fetch('/api/study-aids/formula-sheets')
          .then(r => r.json())
          .then(d => { if (d.sheets) setSheets(d.sheets); })

          .then(d => { if (d.flashcards) setFlashcards(d.flashcards); })
          .catch(err => console.error(err));

              <span>{toastMsg}</span>
            </div>

                <span className="text-slate-900 font-extrabold">Formula Sheets &amp; Flashcards</span>

// =========================================================================
// UTILITIES: CALENDAR .ICS EXPORT GENERATOR (RFC 5545)
// =========================================================================
function generateIcsCalendarFile(interview) {
  const start = new Date(interview.scheduled_start);
  const end = new Date(interview.scheduled_end);

  const formatIcsDate = (d) => {
    return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  };

  const icsContent = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//CareerPath Recruitment//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:REQUEST',
    'BEGIN:VEVENT',
    `UID:${interview.id}@careerpath.internal`,
    `DTSTAMP:${formatIcsDate(new Date())}`,
    `DTSTART:${formatIcsDate(start)}`,
    `DTEND:${formatIcsDate(end)}`,
    `SUMMARY:Interview: ${interview.round_name || 'Technical Round'} - ${interview.company_name || 'Campus Drive'}`,
    `DESCRIPTION:${(interview.instructions || 'Live interview session on CareerPath').replace(/\n/g, '\\n')}\\nMeeting Link: ${interview.meeting_link || 'Virtual'}`,
    `LOCATION:${interview.meeting_link || interview.meeting_location || 'Online'}`,
    'STATUS:CONFIRMED',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `interview_${(interview.round_name || 'session').toLowerCase().replace(/\s+/g, '_')}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        return <span className="px-2.5 py-1 rounded-full text-[11px] font-black bg-emerald-50 text-emerald-700 border border-emerald-200">Final Selected</span>;
      case 'OFFERED':

          <span className="px-3 py-1 rounded-full text-[11px] font-black bg-amber-50 text-amber-800 border border-amber-300 animate-pulse flex items-center gap-1 shadow-xs">

      case 'HIRED':
        return <span className="px-3 py-1 rounded-full text-[11px] font-black bg-emerald-600 text-white shadow-xs">🏆 Hired</span>;
      case 'REJECTED':

  const filteredApps = applications.filter(a => {

  return (

          <p className="text-xs font-bold text-slate-500">Loading application timeline &amp; audit history...</p>
        </div>
      </div>

  const stages = [
    { key: 'APPLIED', label: 'Applied' },
    { key: 'UNDER_REVIEW', label: 'Screening' },
    { key: 'SHORTLISTED', label: 'Shortlisted' },
    { key: 'INTERVIEWING', label: 'Interviews' },
    { key: 'OFFERED', label: 'Offer Issued' },
    { key: 'HIRED', label: 'Hired 🎉' }

  const getStageIndex = (status) => {
    switch (status) {
      case 'APPLIED': return 0;
      case 'UNDER_REVIEW': return 1;
      case 'SHORTLISTED':
      case 'ASSESSMENT': return 2;
      case 'INTERVIEWING':
      case 'SELECTED': return 3;
      case 'OFFERED': return 4;
      case 'HIRED': return 5;
      default: return 0;
    }

    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">

        <div className="flex items-start justify-between border-b border-slate-100 pb-4">

                <img src={application.company_logo} alt={application.company_name} className="max-w-full max-h-full object-contain" />

                <span className="font-mono font-bold text-indigo-600 text-lg">{application.company_name[0]}</span>

              <p className="text-xs text-slate-500 font-medium">{application.job_title} • {application.location_type}</p>

            ✕
          </button>
        </div>

        {/* Tab Switcher */}
        <div className="flex items-center gap-2 mt-4 border-b border-slate-100 pb-2">
          <button
            onClick={() => setActiveTab('timeline')}
            className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${
              activeTab === 'timeline' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100'

          >
            Visual Progress Timeline
          </button>
          <button
            onClick={() => setActiveTab('audit')}
            className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${
              activeTab === 'audit' ? 'bg-indigo-600 text-white' : 'text-slate-600 hover:bg-slate-100'
            }`}
          >

        {activeTab === 'timeline' ? (

                  {/* Track Line */}

            {/* Active Task Banner */}

    </div>
  );
}

// 3. STUDENT INTERVIEW CENTER (SPLIT VIEW, RSVP, RESCHEDULE, CALENDAR .ICS)
// =========================================================================
function StudentInterviewCenter({ currentUser, onBack, onLaunchAiPrep }) {
  const [interviewsData, setInterviewsData] = useState({ counts: {}, interviews: { pendingRsvp: [], upcoming: [], past: [], all: [] } });
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState('pending'); // 'pending' | 'upcoming' | 'past'
  const [selectedInterview, setSelectedInterview] = useState(null);
  const [showRescheduleModal, setShowRescheduleModal] = useState(false);
  const [rescheduleReason, setRescheduleReason] = useState('University Examination Clash');
  const [rescheduleSlots, setRescheduleSlots] = useState('Tomorrow 4:00 PM IST, Day after tomorrow 11:00 AM IST');
  const [submittingRsvp, setSubmittingRsvp] = useState(false);
  const [toastMsg, setToastMsg] = useState('');

  const showToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(''), 3500);
  };

  const studentId = currentUser?.studentId || 's0000000-0000-0000-0000-000000000001';

  const fetchInterviews = () => {
    setLoading(true);
    fetch(`/api/v1/student/interviews?studentId=${studentId}`)
      .then(r => r.json())
      .then(data => {
        if (data.interviews) {
          setInterviewsData(data);
          // Set initial selection
          if (data.interviews.pendingRsvp.length > 0) {
            setSelectedInterview(data.interviews.pendingRsvp[0]);
            setActiveTab('pending');
          } else if (data.interviews.upcoming.length > 0) {
            setSelectedInterview(data.interviews.upcoming[0]);
            setActiveTab('upcoming');
          } else if (data.interviews.all.length > 0) {
            setSelectedInterview(data.interviews.all[0]);
          }
        }
      })
      .catch(err => console.error(err))
      .finally(() => setLoading(false));
  };

  useEffect(() => {
    fetchInterviews();
  }, []);

  const handleRespond = (action) => {
    if (!selectedInterview) return;

    if (action === 'DECLINE') {
      if (!confirm('Are you certain you want to decline this interview? Declining withdraws your candidacy from this recruitment drive.')) {
        return;
      }
    }

    setSubmittingRsvp(true);
    fetch(`/api/v1/student/interviews/${selectedInterview.id}/respond`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        studentId,
        action,
        reason: action === 'RESCHEDULE' ? rescheduleReason : '',
        slotPreferences: action === 'RESCHEDULE' ? rescheduleSlots.split(',').map(s => s.trim()) : []
      })
    })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          showToast(`RSVP status updated: ${action}`);
          setShowRescheduleModal(false);
          fetchInterviews();
        } else {
          showToast(`Error: ${res.error}`);
        }
      })
      .catch(err => showToast(`Network error: ${err.message}`))
      .finally(() => setSubmittingRsvp(false));
  };

  const getActiveList = () => {
    if (activeTab === 'pending') return interviewsData.interviews?.pendingRsvp || [];
    if (activeTab === 'upcoming') return interviewsData.interviews?.upcoming || [];
    return interviewsData.interviews?.past || [];
  };

  const activeList = getActiveList();

  // Check 15-minute countdown for meeting room unlock
  const isMeetingLinkUnlocked = (scheduledStart) => {
    if (!scheduledStart) return false;
    const now = Date.now();
    const start = new Date(scheduledStart).getTime();
    return start - now <= 15 * 60 * 1000; // Unlocked if within 15 minutes or in-progress
  };

  return (
    <div className="space-y-6 animate-fade-in max-w-7xl mx-auto pb-12">
      {/* Toast Notification */}
      {toastMsg && (
        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl border border-slate-700 flex items-center gap-2 animate-bounce">
          <span>🔔</span>
          <span>{toastMsg}</span>
        </div>
      )}

      {/* Top Header */}
      <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white rounded-3xl p-6 border border-slate-200 shadow-xs">
        <div>
          <div className="flex items-center gap-2">
            <button onClick={onBack} className="p-1.5 rounded-xl hover:bg-slate-100 text-slate-500 transition text-sm cursor-pointer">
              ← Back
            </button>
            <span className="text-xs font-black uppercase tracking-wider text-purple-600 bg-purple-50 px-2.5 py-1 rounded-full border border-purple-100">
              Interactive RSVP &amp; Schedule

              <div className="flex items-start justify-between border-b border-slate-100 pb-5">

                <button

              {/* Timing & Location Info Card */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                  <span className="text-xs font-bold text-slate-400 block">Date &amp; Scheduled Slot</span>
                  <span className="text-sm font-extrabold text-slate-900 block mt-1">

                  <span className="text-xs font-mono text-purple-700 font-bold block mt-0.5">

              {/* Instructions */}
              <div className="p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100">

                <div>

                </div>

                <div>
                  {isMeetingLinkUnlocked(selectedInterview.scheduled_start) ? (
                    <a
                      href={selectedInterview.meeting_link || '#'}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-5 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white font-extrabold text-xs transition inline-flex items-center gap-1.5 shadow-md"

                      <span>🔒</span> Locked (Standby)

              </div>

              {/* Actionable RSVP Controls */}
              <div className="pt-4 border-t border-slate-100 space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleRespond('ACCEPT')}
                      disabled={submittingRsvp || selectedInterview.candidate_status === 'ACCEPTED'}
                      className={`px-5 py-2.5 rounded-xl text-xs font-black transition flex items-center gap-1.5 cursor-pointer ${
                        selectedInterview.candidate_status === 'ACCEPTED'
                          ? 'bg-emerald-100 text-emerald-800 cursor-default'
                          : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md'
                      }`}
                    >
                      <span>✓</span>
                      <span>{selectedInterview.candidate_status === 'ACCEPTED' ? 'Slot Accepted' : 'Accept Slot'}</span>
                    </button>

                    <button
                      onClick={() => setShowRescheduleModal(true)}
                      disabled={submittingRsvp}
                      className="px-4 py-2.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 font-extrabold text-xs transition border border-blue-200 cursor-pointer flex items-center gap-1"
                    >
                      <span>🔄</span>
                      <span>Request Reschedule</span>
                    </button>

                    <button
                      onClick={() => handleRespond('DECLINE')}
                      disabled={submittingRsvp}
                      className="px-3 py-2.5 rounded-xl hover:bg-rose-50 text-rose-600 font-bold text-xs transition cursor-pointer"
                    >
                      Decline
                    </button>
                  </div>

                  <button
                    onClick={() => onLaunchAiPrep(selectedInterview)}
                    className="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-black text-xs transition shadow-md shadow-purple-200 cursor-pointer flex items-center gap-1.5"
                  >
                    <span>🎙️</span>
                    <span>Launch AI Prep for this Round →</span>
                  </button>
                </div>
              </div>
            </div>
          ) : (
            <div className="p-16 text-center bg-white rounded-3xl border border-slate-200">
              <span className="text-4xl block mb-2">🎯</span>
              <p className="text-sm font-bold text-slate-700">Select an interview session on the left to review details and RSVP.</p>
            </div>
          )}
        </div>
      </div>

      {/* Reschedule Negotiation Modal */}
      {showRescheduleModal && selectedInterview && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 animate-fade-in">
            <div className="flex items-start justify-between">
              <div>
                <span className="text-[10px] font-black uppercase text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100">
                  Negotiate Replacement Window
                </span>
                <h3 className="text-lg font-black text-slate-900 mt-1">
                  Request Interview Reschedule
                </h3>
              </div>
              <button
                onClick={() => setShowRescheduleModal(false)}
                className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold flex items-center justify-center text-xs cursor-pointer"

                ✕
              </button>

            <div className="mt-4 space-y-3">
              <div>
                <label className="text-xs font-extrabold text-slate-700 block mb-1">

                <select
                  value={rescheduleReason}
                  onChange={(e) => setRescheduleReason(e.target.value)}

                >
                  <option value="University Examination Clash">University End-Semester / Mid-Term Examination</option>
                  <option value="Overlapping Placement Interview">Overlapping Campus Placement Drive Interview</option>
                  <option value="Academic Laboratory / Project Submission">Mandatory Academic Lab / Viva Session</option>
                  <option value="Health / Medical Emergency">Health / Medical Unavailability</option>
                  <option value="Other Legitimate Academic Conflict">Other Verified Academic Conflict</option>
